<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEB · Gestión de Equipos Biomédicos Críticos — HRT 2026</title>
<style>
:root{
  --azul:#1565c0; --azul-osc:#0d47a1; --azul-claro:#e3f2fd;
  --verde:#2e7d32; --verde-bg:#e8f5e9;
  --rojo:#c62828; --rojo-bg:#ffebee;
  --ambar:#ef6c00; --ambar-bg:#fff3e0;
  --gris:#607d8b; --gris-bg:#eceff1;
  --borde:#d0d7de; --texto:#1f2933; --fondo:#f5f7fa;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:14px}
header{background:var(--azul-osc);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600}
header .sub{font-size:12px;opacity:.85}
nav{background:var(--azul);display:flex;flex-wrap:wrap;padding:0 8px}
nav button{background:none;border:none;color:#cfe3ff;padding:11px 16px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}
nav button:hover{color:#fff}
nav button.act{color:#fff;border-bottom-color:#fff;font-weight:600}
nav button .pill{background:var(--rojo);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;margin-left:5px}
main{padding:16px;max-width:1500px;margin:0 auto}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:14px;margin:14px 0 8px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:12px 16px;min-width:150px;flex:1}
.card .num{font-size:26px;font-weight:700}
.card .lbl{font-size:12px;color:var(--gris)}
.card.rojo .num{color:var(--rojo)} .card.verde .num{color:var(--verde)}
.card.ambar .num{color:var(--ambar)} .card.azul .num{color:var(--azul)}
.panel{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:14px;margin-bottom:16px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid var(--borde);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--azul-claro);font-size:12px;white-space:nowrap;position:sticky;top:0}
tr:hover td{background:#f0f6ff}
tr.clic{cursor:pointer}
.tablewrap{max-height:62vh;overflow:auto;border:1px solid var(--borde);border-radius:6px}
.fila-filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input[type=text],input[type=date],input[type=number],select,textarea{
  padding:6px 8px;border:1px solid var(--borde);border-radius:5px;font-size:13px;font-family:inherit;background:#fff}
textarea{width:100%;resize:vertical}
button.btn{background:var(--azul);color:#fff;border:none;border-radius:5px;padding:7px 14px;font-size:13px;cursor:pointer}
button.btn:hover{background:var(--azul-osc)}
button.btn.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}
button.btn.peligro{background:var(--rojo)}
button.btn.mini{padding:3px 8px;font-size:12px}
.tag{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.X{background:var(--azul-claro);color:var(--azul-osc)}
.tag.R{background:var(--ambar-bg);color:var(--ambar)}
.tag.RA{background:#fce4ec;color:#ad1457}
.tag.PM{background:#ede7f6;color:#4527a0}
.tag.SI{background:var(--verde-bg);color:var(--verde)}
.tag.C{background:var(--ambar-bg);color:var(--ambar)}
.tag.FS,.tag.BAJA,.tag.NO{background:var(--rojo-bg);color:var(--rojo)}
.tag.op{background:var(--verde-bg);color:var(--verde)}
.tag.nop{background:var(--rojo-bg);color:var(--rojo)}
.tag.st{background:var(--ambar-bg);color:var(--ambar)}
.tag.gris{background:var(--gris-bg);color:var(--gris)}
.alerta{border-left:4px solid var(--rojo);background:var(--rojo-bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:8px;font-size:13px}
.alerta.ambar{border-left-color:var(--ambar);background:var(--ambar-bg)}
.alerta.azul{border-left-color:var(--azul);background:var(--azul-claro)}
.alerta b{display:block;margin-bottom:2px}
.alerta .acc{float:right}
.modal-fondo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;overflow:auto;padding:24px}
.modal-fondo.abierto{display:block}
.modal{background:#fff;border-radius:10px;max-width:980px;margin:0 auto;padding:18px 22px;position:relative}
.modal .cerrar{position:absolute;top:10px;right:14px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--gris)}
.gridinfo{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;font-size:13px;margin-bottom:10px}
.gridinfo div b{color:var(--gris);font-weight:600;font-size:11px;display:block}
.meses{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;text-align:center;font-size:11px}
.meses .mc{border:1px solid var(--borde);border-radius:5px;padding:4px 2px;background:#fafbfc}
.meses .mc b{display:block;color:var(--gris)}
.hist{border-left:3px solid var(--azul);padding-left:12px;margin:6px 0}
.hist .ev{margin-bottom:8px;font-size:13px}
.hist .ev .f{font-weight:600;color:var(--azul-osc)}
.subtarea{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}
.subtarea.lista{text-decoration:line-through;color:var(--gris)}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.dosc{grid-template-columns:1fr}}
.barra{height:14px;background:var(--gris-bg);border-radius:7px;overflow:hidden;min-width:80px}
.barra div{height:100%;background:var(--verde)}
.nota{font-size:12px;color:var(--gris)}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.derecha{margin-left:auto}
.kbd{background:var(--gris-bg);border-radius:4px;padding:0 5px;font-size:12px}
@media print{
  header,nav,.no-print,.fila-filtros,button{display:none !important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .tablewrap{max-height:none;overflow:visible;border:none}
  .solo-print{display:block !important}
}
.solo-print{display:none}
.ac-cont{position:relative;flex:1;min-width:260px}
.ac-lista{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--borde);
  border-radius:0 0 6px 6px;max-height:260px;overflow:auto;z-index:80;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ac-item{padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f2f5}
.ac-item:hover{background:var(--azul-claro)}
.ac-cont input{width:100%}
</style>
</head>
<body>
<header>
  <h1>GEB · Gestión de Equipos Biomédicos Críticos</h1>
  <span class="sub">Hospital Regional de Temuco — Programa 2026 · <span id="hoy-txt"></span></span>
  <span class="sub derecha" id="resumen-head"></span>
</header>
<nav id="nav">
  <button data-t="panel" class="act">Panel</button>
  <button data-t="inventario">Inventario</button>
  <button data-t="plan">Plan MP</button>
  <button data-t="asignacion">Asignación mensual</button>
  <button data-t="correctivos">Correctivos / ST</button>
  <button data-t="pendientes">Pendientes</button>
  <button data-t="datos">Datos</button>
</nav>
<main id="main"></main>

<div class="modal-fondo" id="modal-fondo" onclick="if(event.target===this)cerrarModal()">
  <div class="modal" id="modal"></div>
</div>

<script id="seed-datos" type="application/json">__DATA__</script>
<script>
"use strict";
/* ====================== Datos y estado ====================== */
const ANIO = 2026;
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MESES_L = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const CAUSALES = {
  C1:"Imposibilidad de desocupar el equipo del paciente por indicación clínica",
  C2:"Equipo en servicio técnico",
  C3:"Equipo no operativo a la espera de repuestos o accesorios",
  C4:"Equipo en préstamo a otro hospital o institución",
  C5:"No disponibilidad de HH del funcionario de equipamiento clínico",
  C6:"No disponibilidad de HH del servicio técnico externo",
  C7:"Ausencia justificada del funcionario responsable por más de 15 días",
  C8:"Contingencia hospitalaria"
};
const CAUSALES_30D = ["C1","C5","C6","C7","C8"];   // plazo 30 días corridos
const FAM_EXTERNA = ["Ventiladores","Máquina de Diálisis","M Anestesia"]; // requieren informe de empresa
const RESPONSABLES_BASE = ["Carlos Bahamondes Seguel","Cristián Beltrán Oviedo","Cristina Rozas Urrutia",
  "Daniel Díaz Neira","Ignacio Berner Bergara","Macarena Toledo","Marco Ulloa","Matías Soazo Garrido",
  "Ricardo Matus Aroca","Tito Millapán Riquelme","Personal Externo"];
const HITOS = {
  asignacion:{nombre:"Asignación de la falla", campos:[["folio","Folio solicitud SIGEM"],["ingeniero","Ingeniero asignado"],["descripcion","Descripción de la falla"]], estado:"En reparación"},
  compra:{nombre:"Compra de repuestos", campos:[["tipoCompra","Tipo (compra ágil / trato directo)"],["informe","N° informe técnico"],["ingeniero","Ingeniero responsable"]], estado:"Espera de repuestos"},
  oc:{nombre:"Orden de compra aprobada", campos:[["oc","N° orden de compra"],["empresa","Empresa"],["ingeniero","Ingeniero responsable"]], estado:"Espera de repuestos"},
  envio:{nombre:"Envío a servicio técnico", campos:[["envio","N° de envío"],["empresa","Empresa"],["folio","Folio solicitud"],["ingeniero","Responsable"],["descripcion","Breve descripción"]], estado:"En servicio técnico"},
  visita:{nombre:"Visita técnica / diagnóstico", campos:[["diagnostico","Diagnóstico"],["empresa","Empresa"],["ingeniero","Ingeniero responsable"]], estado:"En diagnóstico"},
  retorno:{nombre:"Retorno del equipo", campos:[["guia","Folio guía de despacho"],["ingeniero","Ingeniero responsable"],["comentario","Comentarios"]], estado:"Retornado, pendiente entrega"},
  entrega:{nombre:"Entrega al servicio clínico (cierre)", campos:[["comentario","Comentarios"]], estado:"Cerrado"}
};
const LS_KEY = "geb_hrt_2026_v1";

let S = null;          // estado global
let tabActual = "panel";
let mesPlan = new Date().getFullYear()===ANIO ? new Date().getMonth() : 0;
let mesAsig = mesPlan;
let filtros = {q:"",fam:"",serv:"",estado:""};
let filtrosPlan = {q:"",fam:"",resp:"",solo:""};

function seed(){
  const eqs = JSON.parse(document.getElementById("seed-datos").textContent);
  eqs.forEach(e=>{
    e.estado = /fuera de servicio|no operativo/i.test(e.obs||"") ? "No operativo" : "Operativo";
    e.baja = false;
  });
  return {
    version:2, equipos:eqs, fichas:{}, correctivos:[], pendientes:[],
    asig:{}, docs:{}, reprog:{}, responsables:RESPONSABLES_BASE.slice(),
    config:{alertaST:30, alertaCorrectivo:20}, nextCorr:1, nextPend:1
  };
}
function cargar(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      S = JSON.parse(raw);
      if(S.version<2){ S.responsables = RESPONSABLES_BASE.slice(); S.version=2; guardar(); }
      return;
    }
  }catch(e){ console.warn(e); }
  S = seed();
  guardar();
}
function guardar(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ alert("No se pudo guardar en el navegador: "+e.message); }
}

/* ====================== Utilidades ====================== */
const $ = s=>document.querySelector(s);
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function fmtF(iso){ if(!iso) return "—"; const [a,m,d]=iso.split("-"); return `${d}-${m}-${a}`; }
function diasDesde(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso+"T12:00:00"))/86400000); }
function finDeMes(m){ return new Date(ANIO, m+1, 0); }
function fechaLimite30(m){ const d = finDeMes(m); d.setDate(d.getDate()+30); return d; }
function eq(id){ return S.equipos.find(e=>e.id===id); }
function nombreEq(e){ return `${e.equipo||"Equipo"} ${e.marca||""} ${e.modelo||""}`.trim(); }
function codResultado(r){
  if(!r) return "";
  const u = r.toUpperCase();
  if(u==="SI") return "SI";
  if(/^C[1-8]$/.test(u)) return u;
  if(u==="FS") return "FS";
  if(u==="BAJA") return "BAJA";
  if(u==="NO"||u==="NU") return "NO";
  return u;
}
function tagRes(r){
  const c = codResultado(r);
  if(!c) return "";
  const cls = c==="SI"?"SI":(/^C/.test(c)?"C":(c==="FS"||c==="BAJA"?c:"NO"));
  return `<span class="tag ${cls}">${esc(c)}</span>`;
}
function tagPlan(p){ return p?`<span class="tag ${esc(p)}">${esc(p)}</span>`:""; }
function tagEstado(e){
  const s = e.estado||"Operativo";
  const cls = s==="Operativo"?"op":(s==="En servicio técnico"?"st":"nop");
  return `<span class="tag ${cls}">${esc(s)}</span>`;
}
function agregarFicha(eqId, fecha, texto){
  if(!S.fichas[eqId]) S.fichas[eqId]=[];
  S.fichas[eqId].push({f:fecha, t:texto});
  S.fichas[eqId].sort((a,b)=>a.f<b.f?-1:1);
}
function corrAbierto(eqId){
  return S.correctivos.find(c=>c.eqId===eqId && !c.cerrado);
}
function ultimoHito(c){ return c.hitos[c.hitos.length-1]; }
function estadoCorr(c){
  if(c.cerrado) return "Cerrado";
  const h = ultimoHito(c);
  return h ? HITOS[h.tipo].estado : "Abierto";
}

/* ====================== Autocompletado de equipos ====================== */
const AC_SEL = {};   // id del input -> id de equipo elegido
function acHTML(id, ph){
  return `<div class="ac-cont">
    <input type="text" id="${id}" placeholder="${esc(ph)}" autocomplete="off"
      oninput="acBuscar('${id}')" onfocus="acBuscar('${id}')">
    <div id="${id}-lista" class="ac-lista"></div>
  </div>`;
}
function acBuscar(id){
  AC_SEL[id]=null; acInfo(id);
  const q=$("#"+id).value.trim().toLowerCase();
  const cont=$("#"+id+"-lista");
  if(q.length<2){ cont.style.display="none"; cont.innerHTML=""; return; }
  const res=[];
  for(const e of S.equipos){
    if(e.baja) continue;
    const blob=`${e.inv} ${e.serie} ${e.carpeta} ${e.equipo} ${e.marca} ${e.modelo} ${e.servicio} ${e.unidad}`.toLowerCase();
    if(blob.includes(q)){ res.push(e); if(res.length>=12) break; }
  }
  cont.innerHTML = res.map(e=>`<div class="ac-item" onclick="acElegir('${id}',${e.id})">
      <b>${esc(e.inv||e.serie||("Carp. "+e.carpeta))}</b> · ${esc(e.equipo)} ${esc(e.marca)} ${esc(e.modelo)}
      <span class="nota">· serie ${esc(e.serie)||"—"} · ${esc(e.servicio)}</span></div>`).join("")
    || `<div class="ac-item nota">Sin coincidencias para "${esc(q)}"…</div>`;
  cont.style.display="block";
}
function acElegir(id,eqId){
  AC_SEL[id]=eqId;
  const e=eq(eqId);
  $("#"+id).value=`${e.inv||e.serie} — ${e.equipo} ${e.marca} ${e.modelo}`.trim();
  $("#"+id+"-lista").style.display="none";
  acInfo(id);
}
function acInfo(id){
  const el=$("#"+id+"-sel"); if(!el) return;
  const e=AC_SEL[id]?eq(AC_SEL[id]):null;
  el.innerHTML = e
    ? `✔ ${esc(nombreEq(e))} · Inv. ${esc(e.inv)||"s/n"} · Serie ${esc(e.serie)||"—"} · ${esc(e.servicio)} ${tagEstado(e)}`
    : "Escribe y elige el equipo de la lista de coincidencias.";
}
document.addEventListener("click",ev=>{
  if(!ev.target.closest(".ac-cont"))
    document.querySelectorAll(".ac-lista").forEach(l=>l.style.display="none");
});
function selEjecutores(id, sel, conVacio){
  return `<select id="${id}">${conVacio?'<option value="">— elegir —</option>':""}
    ${S.responsables.map(r=>`<option ${r===sel?"selected":""}>${esc(r)}</option>`).join("")}</select>`;
}

/* ====================== Motor de alertas ====================== */
function calcAlertas(){
  const out = [];
  const ahora = new Date();
  // 1. Reprogramaciones con plazo 30 días (C1,C5,C6,C7,C8)
  S.equipos.forEach(e=>{
    if(e.baja) return;
    e.resultado.forEach((r,m)=>{
      const c = codResultado(r[1]);
      if(!/^C[1-8]$/.test(c)) return;
      // ¿se ejecutó después? buscamos SI en algún mes posterior
      const ejecutada = e.resultado.some((r2,m2)=> m2>m && codResultado(r2[1])==="SI");
      if(ejecutada) return;
      if(CAUSALES_30D.includes(c)){
        const lim = fechaLimite30(m);
        const dias = Math.floor((lim-ahora)/86400000);
        if(dias<0)
          out.push({nivel:"rojo", tipo:"Plazo vencido", eqId:e.id,
            txt:`MP de ${MESES_L[m]} reprogramada (${c}) venció hace ${-dias} día(s). Corresponde emitir retiro de circulación (FS).`});
        else if(dias<=10)
          out.push({nivel:"ambar", tipo:"Plazo por vencer", eqId:e.id,
            txt:`MP de ${MESES_L[m]} reprogramada (${c}) vence el ${fmtF(lim.toISOString().slice(0,10))} (${dias} día(s)).`});
      }else{
        // C2/C3/C4: seguimiento documental, alerta informativa si lleva más de 60 días
        const dias = Math.floor((ahora-finDeMes(m))/86400000);
        if(dias>60)
          out.push({nivel:"ambar", tipo:"Seguimiento causal "+c, eqId:e.id,
            txt:`MP de ${MESES_L[m]} con causal ${c} lleva ${dias} días sin ejecutarse. Al retorno del equipo debe ejecutarse de inmediato.`});
      }
    });
  });
  // 2. Correctivos estancados
  S.correctivos.forEach(c=>{
    if(c.cerrado) return;
    const h = ultimoHito(c);
    const d = h?diasDesde(h.fecha):diasDesde(c.fecha);
    const lim = S.config.alertaCorrectivo||20;
    if(d!=null && d>lim){
      out.push({nivel: d>2*lim?"rojo":"ambar", tipo:"Correctivo estancado", eqId:c.eqId, corrId:c.id,
        txt:`Caso #${c.id} lleva ${d} días en estado "${estadoCorr(c)}" sin novedades. Último responsable: ${esc(h?h.ingeniero||h.responsable||"—":"—")}.`});
    }
  });
  // 3. Documentación faltante (MP externa sin informe de empresa)
  S.equipos.forEach(e=>{
    if(!FAM_EXTERNA.includes(e.fam)) return;
    e.resultado.forEach((r,m)=>{
      if(codResultado(r[1])!=="SI") return;
      const d = S.docs[e.id+"-"+m];
      if(!d || !d.emp){
        const dias = Math.floor((ahora-finDeMes(m))/86400000);
        if(dias>15) out.push({nivel:"ambar", tipo:"Informe de empresa pendiente", eqId:e.id,
          txt:`MP externa de ${MESES_L[m]} ejecutada pero falta el informe de la empresa (${dias} días).`});
      }
    });
  });
  // 4. Pendientes vencidos
  S.pendientes.forEach(p=>{
    if(p.done) return;
    if(p.limite && p.limite < hoyISO())
      out.push({nivel:"rojo", tipo:"Pendiente vencido", eqId:p.eqId||null, pendId:p.id,
        txt:`"${esc(p.titulo)}" venció el ${fmtF(p.limite)}.`});
  });
  const orden={rojo:0,ambar:1,azul:2};
  out.sort((a,b)=>orden[a.nivel]-orden[b.nivel]);
  return out;
}

/* ====================== Render principal ====================== */
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("act",b.dataset.t===tabActual));
  const al = calcAlertas();
  const rojas = al.filter(a=>a.nivel==="rojo").length;
  $("#nav [data-t=panel]").innerHTML = "Panel"+(rojas?` <span class="pill">${rojas}</span>`:"");
  const st = S.equipos.filter(e=>!e.baja && e.estado==="En servicio técnico").length;
  const nop = S.equipos.filter(e=>!e.baja && e.estado!=="Operativo").length;
  $("#resumen-head").textContent = `${S.equipos.filter(e=>!e.baja).length} equipos · ${st} en ST · ${nop} no operativos`;
  const m = $("#main");
  if(tabActual==="panel") m.innerHTML = vPanel(al);
  else if(tabActual==="inventario") m.innerHTML = vInventario();
  else if(tabActual==="plan") m.innerHTML = vPlan();
  else if(tabActual==="asignacion") m.innerHTML = vAsignacion();
  else if(tabActual==="correctivos") m.innerHTML = vCorrectivos();
  else if(tabActual==="pendientes") m.innerHTML = vPendientes();
  else if(tabActual==="datos") m.innerHTML = vDatos();
}

/* ====================== Panel ====================== */
function statsMes(m){
  let prog=0, si=0, causal=0, fs=0, pend=0;
  S.equipos.forEach(e=>{
    if(e.baja) return;
    const p = e.plan[m], r = codResultado(e.resultado[m][1]);
    if(["X","R","RA"].includes(p)){
      prog++;
      if(r==="SI") si++;
      else if(/^C/.test(r)) causal++;
      else if(r==="FS"||r==="BAJA"||r==="NO") fs++;
      else pend++;
    }
  });
  return {prog,si,causal,fs,pend};
}

function setResultado(id,m,v){
  const e=eq(id);
  e.resultado[m][0]=e.plan[m]?"X":"";
  e.resultado[m][1]=v;
  if(v==="SI"){
    agregarFicha(id,hoyISO(),`Mantención preventiva de ${MESES_L[m]} ejecutada, equipo operativo`);
  }else if(/^C[1-8]$/.test(v)){
    let destino=null;
    if(m<11){
      const resp=prompt(`Causal ${v}: ${CAUSALES[v]}\n\n¿A qué mes se reprograma? (número 1-12, vacío = sin definir aún)`, String(m+2));
      if(resp){ const n=parseInt(resp,10); if(n>=1&&n<=12) destino=n-1; }
    }
    if(destino!=null){
      e.plan[destino]= e.plan[destino]||"R";
      S.reprog[id+"-"+m]={causal:v,destino:destino};
    }
    agregarFicha(id,hoyISO(),`Reprogramación MP de ${MESES_L[m]}, causal ${v}${destino!=null?`, reprogramada a ${MESES_L[destino]}`:""}`);
    if(CAUSALES_30D.includes(v)){
      const lim=fechaLimite30(m);
      alert(`Recuerda: plazo máximo de ejecución ${fmtF(lim.toISOString().slice(0,10))}. Si no se cumple, corresponde retiro de circulación (FS).`);
    }
  }else if(v==="FS"){
    eq(id).estado="No operativo";
    agregarFicha(id,hoyISO(),`Retiro de circulación por seguridad (FS) — MP de ${MESES_L[m]} no ejecutada en plazo`);
  }else if(v==="BAJA"){
    e.baja=true;
    agregarFicha(id,hoyISO(),"Equipo dado de baja");
  }
  guardar(); render();
}
function setDoc(k,c,v){ if(!S.docs[k])S.docs[k]={}; S.docs[k][c]=v; guardar(); render(); }

function autoAsignar(m){
  if(!S.asig[m])S.asig[m]={};
  S.equipos.forEach(e=>{
    if(e.baja||!["X","R","RA"].includes(e.plan[m])) return;
    if(!S.asig[m][e.id] && e.respMP){
      // empareja con responsable oficial si el nombre de pila coincide
      const match=S.responsables.find(r=>e.respMP.split(/[ -]/)[0] && r.toLowerCase().startsWith(e.respMP.split(/[ -]/)[0].toLowerCase()));
      S.asig[m][e.id]=match||e.respMP;
    }
  });
  guardar(); render();
}
function exportarAsigCSV(m){
  const asigMes=S.asig[m]||{};
  const filas=[["N° Carpeta","N° Inventario","Equipo","Servicio","Unidad","Ubicación","Marca","Modelo","Serie","Año","Frecuencia MP","Programado en mes","Responsable"]];
  S.equipos.forEach(e=>{
    if(e.baja||!["X","R","RA"].includes(e.plan[m])) return;
    filas.push([e.carpeta,e.inv,e.equipo,e.servicio,e.unidad,e.ubicacion,e.marca,e.modelo,e.serie,e.anio,e.frec,e.plan[m],asigMes[e.id]||e.respMP||""]);
  });
  descargarCSV(filas, `Asignacion_${MESES_L[m]}_${ANIO}.csv`);
}
function descargarCSV(filas,nombre){
  const csv="﻿"+filas.map(f=>f.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=nombre; a.click(); URL.revokeObjectURL(a.href);
}

/* ====================== Correctivos ====================== */
let modalCorrId=null;
function vCorrectivos(){
  const abiertos=S.correctivos.filter(c=>!c.cerrado).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const cerrados=S.correctivos.filter(c=>c.cerrado).slice().reverse();
  const fila=c=>{
    const e=eq(c.eqId); const h=ultimoHito(c);
    const dEstado=h?diasDesde(h.fecha):diasDesde(c.fecha);
    const dTotal=diasDesde(c.fecha);
    return `<tr class="clic" onclick="abrirCorrectivo(${c.id})">
      <td>#${c.id}</td><td>${esc(e.inv)||esc(e.serie)}</td>
      <td><b>${esc(e.equipo)}</b> ${esc(e.marca)} ${esc(e.modelo)}<br><span class="nota">${esc(e.servicio)}</span></td>
      <td>${esc(c.folio||"—")}</td><td>${esc(c.ingeniero||"—")}</td>
      <td><span class="tag ${c.cerrado?"op":"st"}">${estadoCorr(c)}</span></td>
      <td>${dEstado!=null?dEstado+" d":"—"}</td><td>${dTotal!=null?dTotal+" d":"—"}</td>
      <td>${c.seguimiento.length?fmtF(c.seguimiento[c.seguimiento.length-1].f):"—"}</td>
    </tr>`;};
  return `
  <h2>Mantenciones correctivas y servicio técnico</h2>
  <div class="fila-filtros">
    <button class="btn" onclick="nuevoCorrectivoDesde(null)">+ Registrar falla</button>
    <span class="derecha nota">${abiertos.length} casos abiertos · ${cerrados.length} cerrados</span>
  </div>
  <h3>Casos abiertos</h3>
  <div class="tablewrap"><table>
    <tr><th>Caso</th><th>Inventario</th><th>Equipo</th><th>Folio SIGEM</th><th>Ingeniero</th><th>Estado</th><th>Días en estado</th><th>Días totales</th><th>Últ. seguimiento</th></tr>
    ${abiertos.map(fila).join("")||"<tr><td colspan=9>Sin casos abiertos.</td></tr>"}
  </table></div>
  <h3>Casos cerrados</h3>
  <div class="tablewrap" style="max-height:30vh"><table>
    <tr><th>Caso</th><th>Inventario</th><th>Equipo</th><th>Folio</th><th>Ingeniero</th><th>Estado</th><th></th><th>Duración</th><th></th></tr>
    ${cerrados.map(fila).join("")||"<tr><td colspan=9>—</td></tr>"}
  </table></div>`;
}
function nuevoCorrectivoDesde(eqId){
  AC_SEL["nc-eq"]=null;
  $("#modal").innerHTML=`
  <button class="cerrar" onclick="cerrarModal()">×</button>
  <h2>Registrar falla — nuevo correctivo</h2>
  <p class="nota"><b>Equipo:</b> escribe el N° de inventario, serie, modelo o servicio; las coincidencias aparecen mientras escribes.</p>
  ${acHTML("nc-eq","Ej: 2-115361 · ASJL-0008 · ventilador UPC…")}
  <p class="nota" id="nc-eq-sel">Escribe y elige el equipo de la lista de coincidencias.</p>
  <div class="flex">
    <label>Fecha de la falla<br><input type="date" id="nc-fecha" value="${hoyISO()}"></label>
    <label>Folio solicitud SIGEM<br><input type="text" id="nc-folio" placeholder="Ej: 2026-121109-19-7177"></label>
    <label>Ingeniero asignado<br>${selEjecutores("nc-ing","",true)}</label>
  </div>
  <label>Descripción de la falla</label>
  <textarea id="nc-desc" rows="3" placeholder="Ej: equipo no cicla, pantalla sin imagen…"></textarea>
  <div style="margin-top:10px"><button class="btn" onclick="crearCorrectivo()">Crear caso</button></div>`;
  if(eqId) acElegir("nc-eq",eqId);
  $("#modal-fondo").classList.add("abierto");
}
function crearCorrectivo(){
  const id=AC_SEL["nc-eq"];
  if(!id) return alert("Primero selecciona el equipo de la lista de coincidencias.");
  const fecha=$("#nc-fecha").value||hoyISO();
  const folio=$("#nc-folio").value.trim();
  const ing=$("#nc-ing").value;
  const desc=$("#nc-desc").value.trim();
  const c={id:S.nextCorr++, eqId:id, fecha, folio, ingeniero:ing, descripcion:desc,
    hitos:[{tipo:"asignacion",fecha,folio,ingeniero:ing,descripcion:desc}], seguimiento:[], cerrado:false};
  S.correctivos.push(c);
  eq(id).estado="No operativo";
  agregarFicha(id,fecha,`Equipo en falla, folio SOL: ${folio||"s/f"}. Técnico asignado: ${ing||"—"}. ${desc}`);
  guardar();
  abrirCorrectivo(c.id);
}
function abrirCorrectivo(cid){
  modalCorrId=cid;
  pintarModalCorr();
  $("#modal-fondo").classList.add("abierto");
}
function pintarModalCorr(){
  const c=S.correctivos.find(x=>x.id===modalCorrId);
  const e=eq(c.eqId);
  const linea=c.hitos.map(h=>{
    const def=HITOS[h.tipo];
    const det=def.campos.map(([k,lbl])=>h[k]?`<span class="nota">${esc(lbl)}: <b>${esc(h[k])}</b></span>`:"").filter(Boolean).join(" · ");
    return `<div class="ev"><span class="f">${fmtF(h.fecha)}</span> — <b>${def.nombre}</b><br>${det}</div>`;
  }).join("");
  const seg=c.seguimiento.slice().reverse().map(s=>`<div class="ev"><span class="f">${fmtF(s.f)}</span> — ${esc(s.t)}</div>`).join("");
  const opcionesHito=Object.entries(HITOS).filter(([k])=>k!=="asignacion")
    .map(([k,v])=>`<option value="${k}">${v.nombre}</option>`).join("");
  $("#modal").innerHTML=`
  <button class="cerrar" onclick="cerrarModal()">×</button>
  <h2>Caso #${c.id} — ${esc(nombreEq(e))} <span class="tag ${c.cerrado?"op":"st"}">${estadoCorr(c)}</span></h2>
  <div class="gridinfo">
    <div><b>Inventario</b>${esc(e.inv)||"—"}</div><div><b>Servicio</b>${esc(e.servicio)}</div>
    <div><b>Folio SIGEM</b>${esc(c.folio)||"—"}</div><div><b>Ingeniero</b>${esc(c.ingeniero)||"—"}</div>
    <div><b>Fecha falla</b>${fmtF(c.fecha)}</div><div><b>Días abiertos</b>${diasDesde(c.fecha)} días</div>
  </div>
  <p>${esc(c.descripcion||"")}</p>
  <div class="dosc">
    <div>
      <h3>Hitos del proceso</h3>
      <div class="hist">${linea}</div>
      ${!c.cerrado?`<div class="panel no-print">
        <div class="flex">
          <select id="hito-tipo" onchange="pintarCamposHito()">${opcionesHito}</select>
          <input type="date" id="hito-fecha" value="${hoyISO()}">
        </div>
        <div id="hito-campos" style="margin-top:8px"></div>
        <button class="btn mini" style="margin-top:8px" onclick="addHito(${c.id})">Registrar hito</button>
      </div>`:""}
    </div>
    <div>
      <h3>Seguimiento (consultas y respuestas)</h3>
      <p class="nota">Registra aquí cada vez que preguntas por el equipo: "10-06: consulté a Ignacio, dice que enviará correo a Dräger".</p>
      <div class="flex no-print">
        <input type="text" id="seg-texto" placeholder="¿A quién consultaste y qué respondió?" style="flex:1">
        <button class="btn mini" onclick="addSeg(${c.id})">Anotar</button>
      </div>
      <div class="hist">${seg||'<p class="nota">Sin seguimientos.</p>'}</div>
      ${!c.cerrado?`<button class="btn peligro mini" onclick="if(confirm('¿Cerrar el caso? El equipo queda operativo.'))cerrarCaso(${c.id})">Cerrar caso (equipo entregado)</button>`:""}
    </div>
  </div>`;
  pintarCamposHito();
}
function pintarCamposHito(){
  const t=$("#hito-tipo"); if(!t) return;
  const def=HITOS[t.value];
  $("#hito-campos").innerHTML=def.campos.map(([k,lbl])=>
    k==="ingeniero"
      ? `<select data-k="${k}" style="width:100%;margin-bottom:5px">
           <option value="">— ${esc(lbl)} —</option>
           ${S.responsables.map(r=>`<option>${esc(r)}</option>`).join("")}</select>`
      : `<input type="text" data-k="${k}" placeholder="${esc(lbl)}" style="width:100%;margin-bottom:5px">`).join("");
}
function addHito(cid){
  const c=S.correctivos.find(x=>x.id===cid);
  const tipo=$("#hito-tipo").value, fecha=$("#hito-fecha").value||hoyISO();
  const h={tipo,fecha};
  document.querySelectorAll("#hito-campos input, #hito-campos select").forEach(i=>{ if(i.value.trim()) h[i.dataset.k]=i.value.trim(); });
  c.hitos.push(h);
  const e=eq(c.eqId), def=HITOS[tipo];
  if(tipo==="envio") e.estado="En servicio técnico";
  else if(tipo==="retorno") e.estado="No operativo";
  else if(tipo==="entrega"){ c.cerrado=true; e.estado="Operativo"; }
  const det=def.campos.map(([k,lbl])=>h[k]?`${lbl}: ${h[k]}`:"").filter(Boolean).join(", ");
  agregarFicha(c.eqId,fecha,`${def.nombre}${det?" — "+det:""} (caso #${c.id})`);
  guardar(); pintarModalCorr();
}
function addSeg(cid){
  const c=S.correctivos.find(x=>x.id===cid);
  const t=$("#seg-texto").value.trim();
  if(!t) return;
  c.seguimiento.push({f:hoyISO(),t});
  guardar(); pintarModalCorr();
}
function cerrarCaso(cid){
  const c=S.correctivos.find(x=>x.id===cid);
  c.cerrado=true;
  c.hitos.push({tipo:"entrega",fecha:hoyISO()});
  const e=eq(c.eqId); e.estado="Operativo";
  agregarFicha(c.eqId,hoyISO(),`Equipo entregado al servicio clínico, caso #${c.id} cerrado. Equipo operativo.`);
  // recordatorio MP pendiente si hay causal C2/C3 sin ejecutar
  const pendMP=e.resultado.some((r,m)=>/^C[234]$/.test(codResultado(r[1])) && !e.resultado.some((r2,m2)=>m2>m&&codResultado(r2[1])==="SI"));
  if(pendMP){
    S.pendientes.push({id:S.nextPend++, titulo:`Ejecutar MP pendiente al retorno — ${nombreEq(e)} (Inv. ${e.inv})`,
      eqId:e.id, limite:hoyISO(), notas:"El equipo retornó de ST con una MP reprogramada por causal C2/C3/C4: debe ejecutarse de inmediato.",
      sub:[], updates:[], done:false, creado:hoyISO()});
    alert("Ojo: este equipo tiene una MP reprogramada por causal C2/C3/C4. Se creó un pendiente para ejecutarla de inmediato.");
  }
  guardar(); pintarModalCorr();
}

/* ====================== Pendientes ====================== */
function vPendientes(){
  const abiertos=S.pendientes.filter(p=>!p.done).sort((a,b)=>(a.limite||"9999")<(b.limite||"9999")?-1:1);
  const listos=S.pendientes.filter(p=>p.done).slice().reverse().slice(0,30);
  const tarjeta=p=>{
    const e=p.eqId?eq(p.eqId):null;
    const vencido=p.limite&&p.limite<hoyISO()&&!p.done;
    return `<div class="panel" style="${vencido?"border-left:4px solid var(--rojo)":""}">
      <div class="flex">
        <label class="subtarea"><input type="checkbox" ${p.done?"checked":""} onchange="togglePend(${p.id})"></label>
        <b style="${p.done?"text-decoration:line-through;color:var(--gris)":""}">${esc(p.titulo)}</b>
        ${p.limite?`<span class="tag ${vencido?"NO":"gris"}">límite ${fmtF(p.limite)}</span>`:""}
        ${e?`<button class="btn mini sec" onclick="abrirEquipo(${e.id})">${esc(e.inv||e.serie)}</button>`:""}
        <span class="derecha nota">creado ${fmtF(p.creado)}</span>
      </div>
      ${p.notas?`<p class="nota">${esc(p.notas)}</p>`:""}
      <div>
        ${p.sub.map((s2,i)=>`<label class="subtarea ${s2.done?"lista":""}">
          <input type="checkbox" ${s2.done?"checked":""} onchange="toggleSub(${p.id},${i})">${esc(s2.t)}</label>`).join("")}
        ${!p.done?`<div class="flex no-print" style="margin-top:4px">
          <input type="text" id="sub-${p.id}" placeholder="Agregar tarea…" onkeydown="if(event.key==='Enter')addSub(${p.id})">
          <button class="btn mini sec" onclick="addSub(${p.id})">+</button>
          <input type="text" id="upd-${p.id}" placeholder="Anotar actualización…" style="flex:1" onkeydown="if(event.key==='Enter')addUpd(${p.id})">
          <button class="btn mini sec" onclick="addUpd(${p.id})">Anotar</button>
        </div>`:""}
      </div>
      ${p.updates.length?`<div class="hist" style="margin-top:6px">${p.updates.slice().reverse().map(u=>`<div class="ev"><span class="f">${fmtF(u.f)}</span> — ${esc(u.t)}</div>`).join("")}</div>`:""}
    </div>`;};
  return `
  <h2>Pendientes y recordatorios</h2>
  <div class="panel no-print">
    <div class="flex">
      <input type="text" id="np-titulo" placeholder="Nuevo pendiente… (ej: pedir informe Dräger ventilador 2-112256)" style="flex:2;min-width:240px">
      <input type="date" id="np-limite">
      ${acHTML("np-eq","Equipo: inventario o serie (opcional)")}
      <button class="btn" onclick="addPend()">Agregar</button>
    </div>
    <p class="nota" id="np-eq-sel"></p>
  </div>
  <h3>Abiertos (${abiertos.length})</h3>
  ${abiertos.map(tarjeta).join("")||'<p class="nota">Nada pendiente.</p>'}
  <h3>Completados recientes</h3>
  ${listos.map(tarjeta).join("")||'<p class="nota">—</p>'}`;
}
function addPend(){
  const t=$("#np-titulo").value.trim();
  if(!t) return alert("Escribe el pendiente.");
  let eqId=AC_SEL["np-eq"]||null;
  if(!eqId && $("#np-eq").value.trim() &&
     !confirm("No elegiste un equipo de la lista de coincidencias. ¿Crear el pendiente sin equipo asociado?")) return;
  S.pendientes.push({id:S.nextPend++, titulo:t, eqId, limite:$("#np-limite").value||null,
    notas:"", sub:[], updates:[], done:false, creado:hoyISO()});
  AC_SEL["np-eq"]=null;
  guardar(); render();
}
function nuevoPendienteDesde(eqId){
  const t=prompt("Describe el pendiente:");
  if(!t) return;
  const lim=prompt("Fecha límite (AAAA-MM-DD, vacío = sin fecha):")||null;
  S.pendientes.push({id:S.nextPend++, titulo:t, eqId, limite:lim, notas:"", sub:[], updates:[], done:false, creado:hoyISO()});
  guardar(); pintarModalEquipo();
}
function togglePend(id){ const p=S.pendientes.find(x=>x.id===id); p.done=!p.done; guardar(); render(); }
function toggleSub(id,i){ const p=S.pendientes.find(x=>x.id===id); p.sub[i].done=!p.sub[i].done; guardar(); render(); }
function addSub(id){
  const inp=$("#sub-"+id); const t=inp.value.trim(); if(!t) return;
  S.pendientes.find(x=>x.id===id).sub.push({t,done:false}); guardar(); render();
}
function addUpd(id){
  const inp=$("#upd-"+id); const t=inp.value.trim(); if(!t) return;
  S.pendientes.find(x=>x.id===id).updates.push({f:hoyISO(),t}); guardar(); render();
}

/* ====================== Datos ====================== */
function vDatos(){
  const kb=Math.round((localStorage.getItem(LS_KEY)||"").length/1024);
  return `
  <h2>Respaldo y datos</h2>
  <div class="panel">
    <p>Todos los cambios se guardan automáticamente <b>en este navegador</b> (localStorage, ${kb} KB usados).
    Para no perder información ante un cambio de equipo o limpieza del navegador, <b>exporta un respaldo periódicamente</b> (ideal: cada viernes) y guárdalo en una carpeta de red o pendrive.</p>
    <div class="flex">
      <button class="btn" onclick="exportarJSON()">⬇ Exportar respaldo completo (.json)</button>
      <label class="btn sec" style="display:inline-block">⬆ Importar respaldo
        <input type="file" accept=".json" style="display:none" onchange="importarJSON(this)"></label>
      <button class="btn sec" onclick="exportarInventarioCSV()">⬇ Inventario + plan a Excel (CSV)</button>
      <button class="btn sec" onclick="exportarFichasCSV()">⬇ Fichas técnicas (CSV)</button>
    </div>
  </div>
  <div class="panel">
    <h3>Ejecutores (lista desplegable de responsables)</h3>
    <p class="nota">Esta lista alimenta los menús desplegables de asignación mensual, correctivos e hitos. Un nombre por línea.</p>
    <textarea rows="6" id="resp-lista">${esc(S.responsables.join("\n"))}</textarea>
    <button class="btn mini" style="margin-top:6px" onclick="guardarResponsables()">Guardar lista</button>
  </div>
  <div class="panel">
    <h3>Parámetros de alerta</h3>
    <label>Días sin novedad en un correctivo para alertar:
      <input type="number" min="1" value="${S.config.alertaCorrectivo}" onchange="S.config.alertaCorrectivo=+this.value;guardar()"></label>
  </div>
  <div class="panel">
    <h3>Zona de riesgo</h3>
    <button class="btn peligro" onclick="if(confirm('Esto borra TODOS los registros hechos en la aplicación y vuelve a los datos originales del Excel. ¿Continuar?')&&confirm('¿Seguro? Exporta un respaldo antes.')){localStorage.removeItem(LS_KEY);location.reload();}">
      Restablecer a datos originales del maestro</button>
  </div>`;
}
function exportarJSON(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));
  a.download=`GEB_respaldo_${hoyISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importarJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d.equipos||!d.version) throw new Error("El archivo no parece un respaldo de GEB.");
      S=d; guardar(); alert("Respaldo importado correctamente."); render();
    }catch(e){ alert("Error al importar: "+e.message); } };
  r.readAsText(f);
}
function exportarInventarioCSV(){
  const filas=[["ID","N° Carpeta","N° Inventario","Familia","Equipo","Servicio","Unidad","Ubicación","Procedencia","Marca","Modelo","Serie","Año","Clasificación","Frecuencia MP","Responsable MP","Estado","Baja",...MESES.map(m=>"Plan "+m),...MESES.map(m=>"Resultado "+m)]];
  S.equipos.forEach(e=>filas.push([e.id,e.carpeta,e.inv,e.fam,e.equipo,e.servicio,e.unidad,e.ubicacion,e.proc,e.marca,e.modelo,e.serie,e.anio,e.clasif,e.frec,e.respMP,e.estado,e.baja?"SI":"",...e.plan,...e.resultado.map(r=>r[1])]));
  descargarCSV(filas,`Inventario_PMP_${ANIO}_${hoyISO()}.csv`);
}
function exportarFichasCSV(){
  const filas=[["N° Inventario","Equipo","Servicio","Fecha","Evento"]];
  Object.entries(S.fichas).forEach(([id,evs])=>{
    const e=eq(+id); if(!e) return;
    evs.forEach(ev=>filas.push([e.inv,e.equipo,e.servicio,ev.f,ev.t]));
  });
  descargarCSV(filas,`Fichas_tecnicas_${hoyISO()}.csv`);
}
function guardarResponsables(){
  S.responsables=$("#resp-lista").value.split("\n").map(s=>s.trim()).filter(Boolean);
  guardar(); alert("Lista guardada."); render();
}
