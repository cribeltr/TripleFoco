<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEB · Gestión de Equipos Biomédicos Críticos — HRT 2026</title>
<style>
:root{
  --azul:#1565c0; --azul-osc:#0d47a1; --azul-claro:#e3f2fd;
  --verde:#2e7d32; --verde-bg:#e8f5e9;
  --rojo:#c62828; --rojo-bg:#ffebee;
  --ambar:#ef6c00; --ambar-bg:#fff3e0;
  --gris:#607d8b; --gris-bg:#eceff1;
  --borde:#d0d7de; --texto:#1f2933; --fondo:#f5f7fa;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:14px}
header{background:linear-gradient(90deg,var(--azul-osc),var(--azul));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600}
header .sub{font-size:12px;opacity:.85}
nav{background:var(--azul);display:flex;flex-wrap:wrap;padding:0 8px}
nav button{background:none;border:none;color:#cfe3ff;padding:11px 16px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}
nav button:hover{color:#fff}
nav button.act{color:#fff;border-bottom-color:#fff;font-weight:600}
nav button .pill{background:var(--rojo);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;margin-left:5px}
main{padding:16px 24px;width:100%;margin:0}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:14px;margin:14px 0 8px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:#fff;border:none;border-radius:12px;padding:14px 18px;min-width:150px;flex:1;box-shadow:0 1px 4px rgba(13,71,161,.10)}
.card .num{font-size:26px;font-weight:700}
.card .lbl{font-size:12px;color:var(--gris)}
.card.rojo .num{color:var(--rojo)} .card.verde .num{color:var(--verde)}
.card.ambar .num{color:var(--ambar)} .card.azul .num{color:var(--azul)}
.panel{background:#fff;border:none;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(13,71,161,.10)}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid var(--borde);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--azul-claro);font-size:12px;white-space:nowrap;position:sticky;top:0}
tbody tr:nth-child(even) td, tr:nth-child(even) td{background:#fafcff}
tr:hover td{background:#eaf3ff !important}
.clic{cursor:pointer}
.alerta.clic:hover,.item-p.clic:hover{filter:brightness(.96)}
div.clic:active{transform:scale(.998)}
.tablewrap{max-height:62vh;overflow:auto;border:1px solid var(--borde);border-radius:6px}
.fila-filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input[type=text],input[type=date],input[type=number],select,textarea{
  padding:7px 9px;border:1px solid var(--borde);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #90caf9;border-color:var(--azul)}
textarea{width:100%;resize:vertical}
button.btn{background:var(--azul);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;transition:background .15s}
button.btn:hover{background:var(--azul-osc)}
button.btn.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}
button.btn.peligro{background:var(--rojo)}
button.btn.mini{padding:3px 8px;font-size:12px}
.tag{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.X{background:var(--azul-claro);color:var(--azul-osc)}
.tag.R{background:var(--ambar-bg);color:var(--ambar)}
.tag.RA{background:#fce4ec;color:#ad1457}
.tag.PM{background:#ede7f6;color:#4527a0}
.tag.SI{background:var(--verde-bg);color:var(--verde)}
.tag.C{background:var(--ambar-bg);color:var(--ambar)}
.tag.FS,.tag.BAJA,.tag.NO{background:var(--rojo-bg);color:var(--rojo)}
.tag.op{background:var(--verde-bg);color:var(--verde)}
.tag.nop{background:var(--rojo-bg);color:var(--rojo)}
.tag.st{background:var(--ambar-bg);color:var(--ambar)}
.tag.gris{background:var(--gris-bg);color:var(--gris)}
.alerta{border-left:4px solid var(--rojo);background:var(--rojo-bg);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:8px;font-size:13px}
.alerta.ambar{border-left-color:var(--ambar);background:var(--ambar-bg)}
.alerta.azul{border-left-color:var(--azul);background:var(--azul-claro)}
.alerta b{display:block;margin-bottom:2px}
.alerta .acc{float:right}
.modal-fondo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;overflow:auto;padding:24px}
.modal-fondo.abierto{display:block}
.modal{background:#fff;border-radius:14px;max-width:980px;margin:0 auto;padding:20px 24px;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.modal .cerrar{position:absolute;top:10px;right:14px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--gris)}
.modal h2{border-bottom:2px solid var(--azul-claro);padding-bottom:10px;margin-bottom:14px}
.modal h3{color:var(--azul-osc);border-left:3px solid var(--azul);padding-left:8px}
.gridinfo{background:#f6f9fc;border-radius:10px;padding:12px 14px}
.gridinfo div b{text-transform:uppercase;letter-spacing:.4px;font-size:10px}
.meses .mc{transition:background .15s}
.meses .mc.actual{border:2px solid var(--azul);background:var(--azul-claro)}
.form-suave{background:#f6f9fc;border-radius:10px;padding:10px;margin-bottom:10px}
.gridinfo{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;font-size:13px;margin-bottom:10px}
.gridinfo div b{color:var(--gris);font-weight:600;font-size:11px;display:block}
.meses{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;text-align:center;font-size:11px}
.meses .mc{border:1px solid var(--borde);border-radius:5px;padding:4px 2px;background:#fafbfc}
.meses .mc b{display:block;color:var(--gris)}
.hist{border-left:3px solid var(--azul);padding-left:12px;margin:6px 0}
.hist .ev{margin-bottom:8px;font-size:13px}
.hist .ev .f{font-weight:600;color:var(--azul-osc)}
.subtarea{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}
.subtarea.lista{text-decoration:line-through;color:var(--gris)}
.dosc{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.dosc{grid-template-columns:1fr}}
.barra{height:14px;background:var(--gris-bg);border-radius:7px;overflow:hidden;min-width:80px}
.barra div{height:100%;background:var(--verde)}
.nota{font-size:12px;color:var(--gris)}
.x-btn{background:none;border:none;color:var(--rojo);cursor:pointer;font-size:15px;padding:0 5px;line-height:1;vertical-align:middle}
.x-btn:hover{background:var(--rojo-bg);border-radius:4px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.derecha{margin-left:auto}
.kbd{background:var(--gris-bg);border-radius:4px;padding:0 5px;font-size:12px}
@media print{
  header,nav,.no-print,.fila-filtros,button{display:none !important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .tablewrap{max-height:none;overflow:visible;border:none}
  .solo-print{display:block !important}
}
.solo-print{display:none}
.ac-cont{position:relative;flex:1;min-width:260px}
.ac-lista{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--borde);
  border-radius:0 0 6px 6px;max-height:260px;overflow:auto;z-index:80;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ac-item{padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f2f5}
.ac-item:hover{background:var(--azul-claro)}
.ac-cont input{width:100%}
.matriz{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
@media(max-width:1300px){.kanban{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.matriz,.kanban{grid-template-columns:1fr}}
.cuad{border-radius:12px;padding:12px;min-height:120px}
.cuad h4{margin:0 0 2px;font-size:14px}
.cuad .desc{font-size:11px;opacity:.75;margin-bottom:8px}
.item-p{background:#fff;border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:13px;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.item-p .tit{flex:1;min-width:120px}
.sapo-banner{background:linear-gradient(90deg,#1b5e20,#2e7d32);color:#fff;border-radius:12px;
  padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.sapo-banner b{font-size:15px}
.btn-sapo{background:none;border:none;cursor:pointer;font-size:16px;padding:0 3px;opacity:.45}
.btn-sapo.act{opacity:1;filter:drop-shadow(0 0 3px #2e7d32)}
.prio-sel{font-size:11px;padding:3px 5px}
table.fija{table-layout:fixed;width:100%}
table.fija td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.fija th{overflow:visible}
th{position:relative}
.fc-btn{background:none;border:none;cursor:pointer;font-size:11px;padding:0 2px;color:var(--azul)}
.fc-btn.act{color:#fff;background:var(--ambar);border-radius:4px;padding:0 4px}
.fc-drop{position:absolute;top:100%;left:0;min-width:210px;max-width:280px;background:#fff;
  border:1px solid var(--borde);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);
  padding:8px;z-index:95;font-weight:normal;text-align:left;white-space:normal}
.fc-drop input[type=text]{width:100%;margin-bottom:4px}
.fc-lista{max-height:230px;overflow:auto}
.fc-item{display:flex;gap:6px;align-items:flex-start;font-size:12px;padding:2px 0;cursor:pointer}
.fc-acciones{display:flex;gap:6px;margin-bottom:4px}
@media(max-width:1250px){.oc-lg{display:none}}
@media(max-width:950px){.oc-md{display:none}}
@media(max-width:700px){.oc-sm{display:none}}
</style>
</head>
<body>
<header>
  <h1>GEB · Gestión de Equipos Biomédicos Críticos</h1>
  <span class="sub">Hospital Regional de Temuco — Programa 2026 · <span id="hoy-txt"></span></span>
  <button class="btn mini sec" style="margin-left:8px" onclick="abrirGuia()">❓ Guía</button>
  <span class="sub derecha" id="resumen-head"></span>
</header>
<nav id="nav">
  <button data-t="hoy" class="act">🌅 Hoy</button>
  <button data-t="panel">📊 Panel</button>
  <button data-t="inventario">🗂 Inventario</button>
  <button data-t="plan">🗓 Plan MP</button>
  <button data-t="asignacion">👷 Asignación</button>
  <button data-t="informes">📄 Informes</button>
  <button data-t="correctivos">🛠 Correctivos</button>
  <button data-t="pendientes">📌 Pendientes</button>
  <button data-t="datos">⚙️ Datos</button>
</nav>
<main id="main"></main>

<div class="modal-fondo" id="modal-fondo" onclick="if(event.target===this)cerrarModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
"use strict";
/* ====================== Datos y estado ====================== */
const ANIO = 2026;
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MESES_L = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const CAUSALES = {
  C1:"Imposibilidad de desocupar el equipo del paciente por indicación clínica",
  C2:"Equipo en servicio técnico",
  C3:"Equipo no operativo, a la espera de repuestos o accesorios",
  C4:"Equipo en préstamo a otro hospital o institución",
  C5:"No disponibilidad de horas hombre del funcionario SEC por alta carga laboral",
  C6:"No disponibilidad de horas hombre del servicio técnico externo",
  C7:"Ausencia justificada del funcionario SEC superior a 15 días",
  C8:"Contingencia hospitalaria"
};
const CAUSALES_30D = ["C1","C5","C6","C7","C8"];   // plazo 30 días corridos
const FAM_EXTERNA = ["Ventiladores","Máquina de Diálisis","M Anestesia"]; // requieren informe de empresa
const RESPONSABLES_BASE = ["Carlos Bahamondes Seguel","Cristián Beltrán Oviedo","Cristina Rozas Urrutia",
  "Daniel Díaz Neira","Ignacio Berner Bergara","Macarena Toledo","Marco Ulloa","Matías Soazo Garrido",
  "Ricardo Matus Aroca","Tito Millapán Riquelme","Personal Externo"];
const HITOS = {
  asignacion:{nombre:"Asignación de la falla", campos:[["folio","Folio solicitud SIGEM"],["ingeniero","Ingeniero asignado"],["descripcion","Descripción de la falla"]], estado:"En reparación"},
  compra:{nombre:"Compra de repuestos", campos:[["tipoCompra","Tipo (compra ágil / trato directo)"],["informe","N° informe técnico"],["ingeniero","Ingeniero responsable"]], estado:"Espera de repuestos"},
  oc:{nombre:"Orden de compra aprobada", campos:[["oc","N° orden de compra"],["empresa","Empresa"],["ingeniero","Ingeniero responsable"]], estado:"Espera de repuestos"},
  envio:{nombre:"Envío a servicio técnico", campos:[["envio","N° de envío"],["empresa","Empresa"],["folio","Folio solicitud"],["ingeniero","Responsable"],["descripcion","Breve descripción"]], estado:"En servicio técnico"},
  visita:{nombre:"Visita técnica / diagnóstico", campos:[["diagnostico","Diagnóstico"],["empresa","Empresa"],["ingeniero","Ingeniero responsable"]], estado:"En diagnóstico"},
  retorno:{nombre:"Retorno del equipo", campos:[["guia","Folio guía de despacho"],["ingeniero","Ingeniero responsable"],["comentario","Comentarios"]], estado:"Retornado, pendiente entrega"},
  entrega:{nombre:"Entrega al servicio clínico (cierre)", campos:[["comentario","Comentarios"]], estado:"Cerrado"}
};
const LS_KEY = "geb_hrt_v3";   // clave nueva: parte limpio, sin datos precargados

let S = null;          // estado global
let tabActual = "hoy";
let mesPlan = new Date().getFullYear()===ANIO ? new Date().getMonth() : 0;
let mesAsig = mesPlan;
let filtros = {q:"",fam:"",serv:"",estado:""};
let filtrosPlan = {q:"",fam:"",resp:"",solo:""};

function seed(){
  // la aplicación parte vacía: el inventario y el plan se cargan
  // importando el Excel maestro desde el Panel o la pestaña Datos
  return {
    version:3, equipos:[], fichas:{}, correctivos:[], pendientes:[],
    asig:{}, docs:{}, reprog:{}, mpEjec:{}, responsables:RESPONSABLES_BASE.slice(),
    config:{alertaST:30, alertaCorrectivo:20}, nextCorr:1, nextPend:1
  };
}
function cargar(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ S = JSON.parse(raw); return; }
  }catch(e){ console.warn(e); }
  localStorage.removeItem("geb_hrt_2026_v1");  // limpiar datos de versiones anteriores
  S = seed();
  guardar();
}
function normalizar(){
  S.mpEjec = S.mpEjec || {};
  // hitos en orden cronológico aunque se hayan registrado en desorden
  (S.correctivos||[]).forEach(c=>{
    ordenarHitos(c);
    c.cerrado = c.hitos.some(h=>h.tipo==="entrega");
  });
}
function guardar(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ alert("No se pudo guardar en el navegador: "+e.message); }
}

/* ====================== Utilidades ====================== */
const $ = s=>document.querySelector(s);
function clickFila(ev,fn){
  // ignora clics sobre controles internos (botones, selects, casillas…)
  if(ev.target.closest("select,input,button,label,a,textarea")) return;
  fn();
}
function verPendiente(id){
  const pd=S.pendientes.find(x=>x.id===id);
  cerrarModal();
  tabActual="pendientes"; vistaPend="lista"; filtroPend=pd?pd.titulo:"";
  render();
}
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function fmtF(iso){ if(!iso) return "—"; const [a,m,d]=iso.split("-"); return `${d}-${m}-${a}`; }
function diasDesde(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso+"T12:00:00"))/86400000); }
function finDeMes(m){ return new Date(ANIO, m+1, 0); }
function fechaLimite30(m){ const d = finDeMes(m); d.setDate(d.getDate()+30); return d; }
function eq(id){ return S.equipos.find(e=>e.id===id); }
function nombreEq(e){ return `${e.equipo||"Equipo"} ${e.marca||""} ${e.modelo||""}`.trim(); }
function codResultado(r){
  if(!r) return "";
  const u = r.toUpperCase().trim();
  if(u==="SI") return "SI";
  if(u==="SI-RA") return "SI-RA";
  if(/^C[1-8]$/.test(u)) return u;
  if(u==="FS") return "FS";
  if(u==="BAJA") return "BAJA";
  if(u==="NO") return "NO";
  if(u==="NU") return "NU";
  return u;
}
function esEjecutada(c){ return c==="SI"||c==="SI-RA"; }
function tagRes(r){
  const c = codResultado(r);
  if(!c) return "";
  const cls = esEjecutada(c)?"SI":(/^C/.test(c)?"C":(c==="FS"||c==="BAJA"?c:"NO"));
  return `<span class="tag ${cls}">${esc(c)}</span>`;
}
function tagPlan(p){ return p?`<span class="tag ${esc(p)}">${esc(p)}</span>`:""; }
function tagEstado(e){
  const s = e.estado||"Operativo";
  const cls = s==="Operativo"?"op":(s==="En servicio técnico"?"st":"nop");
  return `<span class="tag ${cls}">${esc(s)}</span>`;
}
function agregarFicha(eqId, fecha, texto, ejecutor, estado){
  if(!S.fichas[eqId]) S.fichas[eqId]=[];
  const ev={f:fecha, t:texto};
  if(ejecutor) ev.e=ejecutor;
  if(estado) ev.st=estado;
  S.fichas[eqId].push(ev);
  S.fichas[eqId].sort((a,b)=>a.f<b.f?-1:1);
}
function tagSt(st){
  if(!st) return "";
  const cls=st==="Operativo"?"op":(st==="En servicio técnico"?"st":"nop");
  return `<span class="tag ${cls}">${esc(st)}</span>`;
}
function corrAbierto(eqId){
  return S.correctivos.find(c=>c.eqId===eqId && !c.cerrado);
}
function ordenarHitos(c){ c.hitos.sort((a,b)=>a.fecha<b.fecha?-1:(a.fecha>b.fecha?1:0)); }
function ultimoHito(c){ return c.hitos[c.hitos.length-1]; }
function estadoCorr(c){
  if(c.cerrado) return "Cerrado";
  const h = ultimoHito(c);
  return h ? HITOS[h.tipo].estado : "Abierto";
}

/* ====================== Autocompletado de equipos ====================== */
const AC_SEL = {};   // id del input -> id de equipo elegido
function acHTML(id, ph){
  return `<div class="ac-cont">
    <input type="text" id="${id}" placeholder="${esc(ph)}" autocomplete="off"
      oninput="acBuscar('${id}')" onfocus="acBuscar('${id}')">
    <div id="${id}-lista" class="ac-lista"></div>
  </div>`;
}
function acBuscar(id){
  AC_SEL[id]=null; acInfo(id);
  const q=$("#"+id).value.trim().toLowerCase();
  const cont=$("#"+id+"-lista");
  if(q.length<2){ cont.style.display="none"; cont.innerHTML=""; return; }
  const res=[];
  for(const e of S.equipos){
    if(e.baja) continue;
    const blob=`${e.inv} ${e.serie} ${e.carpeta} ${e.equipo} ${e.marca} ${e.modelo} ${e.servicio} ${e.unidad}`.toLowerCase();
    if(blob.includes(q)){ res.push(e); if(res.length>=12) break; }
  }
  cont.innerHTML = res.map(e=>`<div class="ac-item" onclick="acElegir('${id}',${e.id})">
      <b>${esc(e.inv||e.serie||("Carp. "+e.carpeta))}</b> · ${esc(e.equipo)} ${esc(e.marca)} ${esc(e.modelo)}
      <span class="nota">· serie ${esc(e.serie)||"—"} · ${esc(e.servicio)}</span></div>`).join("")
    || `<div class="ac-item nota">Sin coincidencias para "${esc(q)}"…</div>`;
  cont.style.display="block";
}
function acElegir(id,eqId){
  AC_SEL[id]=eqId;
  const e=eq(eqId);
  $("#"+id).value=`${e.inv||e.serie} — ${e.equipo} ${e.marca} ${e.modelo}`.trim();
  $("#"+id+"-lista").style.display="none";
  acInfo(id);
}
function acInfo(id){
  const el=$("#"+id+"-sel"); if(!el) return;
  const e=AC_SEL[id]?eq(AC_SEL[id]):null;
  el.innerHTML = e
    ? `✔ ${esc(nombreEq(e))} · Inv. ${esc(e.inv)||"s/n"} · Serie ${esc(e.serie)||"—"} · ${esc(e.servicio)} ${tagEstado(e)}`
    : "Escribe y elige el equipo de la lista de coincidencias.";
}
document.addEventListener("click",ev=>{
  if(!ev.target.closest(".ac-cont"))
    document.querySelectorAll(".ac-lista").forEach(l=>l.style.display="none");
  if(fcAbierto && !ev.target.closest(".fc-drop") && !ev.target.closest(".fc-btn")){
    fcAbierto=null; fcTabla=null; render();
  }
});
function selEjecutores(id, sel, conVacio){

/* ====================== Motor de alertas ====================== */
function calcAlertas(){
  const out = [];
  const ahora = new Date();
  // 1. Reprogramaciones con plazo 30 días (C1,C5,C6,C7,C8)
  S.equipos.forEach(e=>{
    if(e.baja) return;
    e.resultado.forEach((r,m)=>{
      const c = codResultado(r[1]);
      if(!/^C[1-8]$/.test(c)) return;
      // ¿se ejecutó después? buscamos SI en algún mes posterior
      const ejecutada = e.resultado.some((r2,m2)=> m2>m && esEjecutada(codResultado(r2[1])));
      if(ejecutada) return;
      if(CAUSALES_30D.includes(c)){
        const lim = fechaLimite30(m);
        const dias = Math.floor((lim-ahora)/86400000);
        if(dias<0)
          out.push({nivel:"rojo", tipo:"Plazo vencido", eqId:e.id,
            txt:`MP de ${MESES_L[m]} reprogramada (${c}) venció hace ${-dias} día(s). Corresponde emitir retiro de circulación (FS).`});
        else if(dias<=10)
          out.push({nivel:"ambar", tipo:"Plazo por vencer", eqId:e.id,
            txt:`MP de ${MESES_L[m]} reprogramada (${c}) vence el ${fmtF(lim.toISOString().slice(0,10))} (${dias} día(s)).`});
      }else{
        // C2/C3/C4: seguimiento documental, alerta informativa si lleva más de 60 días
        const dias = Math.floor((ahora-finDeMes(m))/86400000);
        if(dias>60)
          out.push({nivel:"ambar", tipo:"Seguimiento causal "+c, eqId:e.id,
            txt:`MP de ${MESES_L[m]} con causal ${c} lleva ${dias} días sin ejecutarse. Al retorno del equipo debe ejecutarse de inmediato.`});
      }
    });
  });
  // 2. Correctivos estancados
  S.correctivos.forEach(c=>{
    if(c.cerrado) return;
    const h = ultimoHito(c);
    const d = h?diasDesde(h.fecha):diasDesde(c.fecha);
    const lim = S.config.alertaCorrectivo||20;
    if(d!=null && d>lim){
      out.push({nivel: d>2*lim?"rojo":"ambar", tipo:"Correctivo estancado", eqId:c.eqId, corrId:c.id,
        txt:`Caso #${c.id} lleva ${d} días en estado "${estadoCorr(c)}" sin novedades. Último responsable: ${esc(h?h.ingeniero||h.responsable||"—":"—")}.`});
    }
  });
  // 3. Documentación faltante (MP externa sin informe de empresa)
  S.equipos.forEach(e=>{
    if(!FAM_EXTERNA.includes(e.fam)) return;
    e.resultado.forEach((r,m)=>{
      if(!esEjecutada(codResultado(r[1]))) return;
      const d = S.docs[e.id+"-"+m];
      if(!d || !d.emp){
        const dias = Math.floor((ahora-finDeMes(m))/86400000);
        if(dias>15) out.push({nivel:"ambar", tipo:"Informe de empresa pendiente", eqId:e.id,
          txt:`MP externa de ${MESES_L[m]} ejecutada pero falta el informe de la empresa (${dias} días).`});
      }
    });
  });
  // 4. Pendientes vencidos
  S.pendientes.forEach(p=>{
    if(p.done) return;
    if(p.limite && p.limite < hoyISO())
      out.push({nivel:"rojo", tipo:"Pendiente vencido", eqId:p.eqId||null, pendId:p.id,
        txt:`"${esc(p.titulo)}" venció el ${fmtF(p.limite)}.`});
  });
  const orden={rojo:0,ambar:1,azul:2};
  out.sort((a,b)=>orden[a.nivel]-orden[b.nivel]);
  return out;
}

function statsMes(m){
  let prog=0, si=0, causal=0, fs=0, pend=0;
  S.equipos.forEach(e=>{
    if(e.baja) return;
    const p = e.plan[m], r = codResultado(e.resultado[m][1]);
    if(["X","R","RA"].includes(p)){
      prog++;
      if(esEjecutada(r)) si++;
      else if(/^C/.test(r)) causal++;
      else if(r==="FS"||r==="BAJA"||r==="NO"||r==="NU") fs++;
      else pend++;
    }
  });
  return {prog,si,causal,fs,pend};
}

  if(k==="act"){ const f=S.fichas[e.id]; return f&&f.length?f[f.length-1].f:""; }
  if(k==="estado") return e.baja?"Baja":(e.estado||"Operativo");
  if(k==="dias"){
    const c=corrAbierto(e.id);
    if(c){ const h=ultimoHito(c); return String(diasDesde(h?h.fecha:c.fecha)); }
    const evs=S.fichas[e.id]||[];
    const f=evs.slice().reverse().find(ev=>ev.st)||evs[evs.length-1];
    return f?String(diasDesde(f.f)):"";
  }
  return String(e[k]??"").trim();
}
function valColPlan(e,k){
  if(k==="plan") return e.plan[mesPlan]||"";
  if(k==="resp") return (S.asig[mesPlan]||{})[e.id]||e.respMP||"(sin asignar)";
  if(k==="res"){ const r=codResultado(e.resultado[mesPlan][1]); return r||"(pendiente)"; }
  return String(e[k]??"").trim();
}
function pasaBusqueda(e){
  if(!filtros.q) return true;
  const q=filtros.q.toLowerCase();
  return `${e.id} ${e.inv} ${e.carpeta} ${e.equipo} ${e.marca} ${e.modelo} ${e.serie} ${e.servicio} ${e.unidad} ${e.ubicacion}`.toLowerCase().includes(q);
}
function basePlan(e){
  if(e.baja) return false;
  if(!["X","R","RA"].includes(e.plan[mesPlan])) return false;
  if(filtrosPlan.fam && e.fam!==filtrosPlan.fam) return false;
  const r=codResultado(e.resultado[mesPlan][1]);
  if(filtrosPlan.solo==="pend" && r) return false;
  if(filtrosPlan.solo==="causal" && !/^C/.test(r)) return false;
  if(filtrosPlan.q){
    const q=filtrosPlan.q.toLowerCase();
    if(!`${e.id} ${e.inv} ${e.carpeta} ${e.equipo} ${e.marca} ${e.modelo} ${e.serie} ${e.servicio}`.toLowerCase().includes(q)) return false;
  }
  return true;
}
/* ---- filtros tipo Excel, genéricos para varias tablas ---- */
let fcTabla=null, fcAbierto=null, fcQ="", _fcVals=[];
const FCF={inv:{}, plan:{}, dsrv:{}, deq:{}};
let _dist={servicio:[],equipo:[]};
const COLS_DIST_NUM=[{k:"t",n:"Totales",w:"11%"},{k:"op",n:"Operativos",w:"11%"},
  {k:"no",n:"No operativos",w:"12%"},{k:"st",n:"En serv. técnico",w:"13%"},{k:"bj",n:"Baja",w:"10%"}];
function fcCfg(t){
  if(t==="inv") return {cols:COLS_INV, base:pasaBusqueda, val:valCol};
  if(t==="plan") return {cols:COLS_PLAN, base:basePlan, val:valColPlan};
  const campo=t==="dsrv"?"servicio":"equipo";
  return {cols:[{k:"k",n:campo==="servicio"?"Servicio":"Equipo",w:"30%"},...COLS_DIST_NUM],
    base:()=>true, val:(g,k)=>String(g[k]), rows:()=>_dist[campo]};
}
function fcPasa(t,e,excepto){
  const cfg=fcCfg(t), fs=FCF[t];
  for(const c of cfg.cols){
    if(c.k===excepto||c.nf) continue;
    const set=fs[c.k];
    if(set&&!set.has(cfg.val(e,c.k))) return false;
  }
  return true;
}
function fcFilas(t,excepto){
  const cfg=fcCfg(t);
  return (cfg.rows?cfg.rows():S.equipos).filter(e=>cfg.base(e)&&fcPasa(t,e,excepto));
}
function toggleFC(t,k){
  if(fcTabla===t&&fcAbierto===k){ fcTabla=null; fcAbierto=null; }
  else { fcTabla=t; fcAbierto=k; }
  fcQ=""; render();
}
function toggleValFC(t,idx){
  const val=_fcVals[idx], k=fcAbierto, cfg=fcCfg(t);
  let set=FCF[t][k];
  if(!set){
    set=new Set();
    fcFilas(t,k).forEach(e=>set.add(cfg.val(e,k)));
    set.delete(val);
    FCF[t][k]=set;
  }else if(set.has(val)) set.delete(val);
  else set.add(val);
  render();
}
function limpiarFC(t,k){ delete FCF[t][k]; render(); }
function ningunoFC(t,k){ FCF[t][k]=new Set(); render(); }
function dropFC(t,c){
  const cfg=fcCfg(t);
  const vals=new Map();
  fcFilas(t,c.k).forEach(e=>{ const v=cfg.val(e,c.k); vals.set(v,(vals.get(v)||0)+1); });
  let lista=[...vals.entries()].sort((a,b)=>{
    const na=+a[0], nb=+b[0];
    if(!isNaN(na)&&!isNaN(nb)&&a[0]!==""&&b[0]!=="") return na-nb;
    return a[0]<b[0]?-1:1;
  });
  if(fcQ) lista=lista.filter(([v])=>v.toLowerCase().includes(fcQ.toLowerCase()));
  const set=FCF[t][c.k];
  const muestra=lista.slice(0,250);
  _fcVals=muestra.map(([v])=>v);
  const fmtV=v=>c.k==="act"&&v?fmtF(v):(v===""?"(vacío)":v);
  return `<div class="fc-drop" onclick="event.stopPropagation()">
    <input type="text" id="fc-q" placeholder="Buscar valor…" value="${esc(fcQ)}" oninput="fcQ=this.value;render()">
    <div class="fc-acciones">
      <button class="btn mini sec" onclick="limpiarFC('${t}','${c.k}')">Todos</button>
      <button class="btn mini sec" onclick="ningunoFC('${t}','${c.k}')">Ninguno</button>
      <span class="nota derecha">${lista.length} valor(es)</span>
    </div>
    <div class="fc-lista">
      ${muestra.map(([v,n],i)=>`<label class="fc-item">
        <input type="checkbox" ${!set||set.has(v)?"checked":""}
          onchange="event.stopPropagation();toggleValFC('${t}',${i})">
        <span>${esc(fmtV(v))} <span class="nota">(${n})</span></span></label>`).join("")||'<p class="nota">Sin valores</p>'}
      ${lista.length>250?'<p class="nota">…afina la búsqueda para ver más</p>':""}
    </div>
  </div>`;
}
function thFC(t,c){
  if(c.nf) return `<th style="width:${c.w}" class="${c.cls||""}">${c.n}</th>`;
  const act=!!FCF[t][c.k];
  return `<th style="width:${c.w}" class="${c.cls||""}">${c.n}
    <button class="fc-btn ${act?"act":""}" title="Filtrar ${esc(c.n)}"
      onclick="event.stopPropagation();toggleFC('${t}','${c.k}')">▾</button>
    ${fcTabla===t&&fcAbierto===c.k?dropFC(t,c):""}</th>`;
}

function setResultado(id,m,v){
  const e=eq(id);
  if(v==="SI"||v==="SI-RA"){ abrirEjecucion(id,m,v); return; }  // se confirma en el formulario
  e.resultado[m][0]=e.plan[m]?"X":"";
  e.resultado[m][1]=v;
  if(!v){ delete S.reprog[id+"-"+m]; delete S.mpEjec[id+"-"+m]; guardar(); render(); return; }
  if(/^C[1-8]$/.test(v)){
    let destino=null;
    if(m<11){
      const resp=prompt(`Causal ${v}: ${CAUSALES[v]}\n\n¿A qué mes se reprograma? (número 1-12, vacío = sin definir aún)`, String(m+2));
      if(resp){ const n=parseInt(resp,10); if(n>=1&&n<=12) destino=n-1; }
    }
    if(destino!=null){
      e.plan[destino]= e.plan[destino]||"R";
      S.reprog[id+"-"+m]={causal:v,destino:destino};
    }
    agregarFicha(id,hoyISO(),`Reprogramación MP de ${MESES_L[m]}, causal ${v}${destino!=null?`, reprogramada a ${MESES_L[destino]}`:""}`);
    if(CAUSALES_30D.includes(v)){
      const lim=fechaLimite30(m);
      alert(`Recuerda: plazo máximo de ejecución ${fmtF(lim.toISOString().slice(0,10))}. Si no se cumple, corresponde retiro de circulación (FS).`);
    }
  }else if(v==="FS"){
    eq(id).estado="No operativo";
    agregarFicha(id,hoyISO(),`Retiro de circulación por seguridad (FS) — MP de ${MESES_L[m]} no ejecutada en plazo`);
  }else if(v==="BAJA"){
    e.baja=true;
    agregarFicha(id,hoyISO(),"Equipo dado de baja");
  }
  guardar(); render();
}

function autoAsignar(m){
  if(!S.asig[m])S.asig[m]={};
  S.equipos.forEach(e=>{
    if(e.baja||!["X","R","RA"].includes(e.plan[m])) return;
    if(!S.asig[m][e.id] && e.respMP){
      // empareja con responsable oficial si el nombre de pila coincide
      const match=S.responsables.find(r=>e.respMP.split(/[ -]/)[0] && r.toLowerCase().startsWith(e.respMP.split(/[ -]/)[0].toLowerCase()));
      S.asig[m][e.id]=match||e.respMP;
    }
  });
  guardar(); render();
}
/* ---- generador de .xlsx con lista desplegable (sin librerías) ---- */
const CRC_T=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipCrear(files){
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
  files.forEach(f=>{
    const nb=enc.encode(f.n), d=f.d, crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(lh.buffer),nb,d);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);
    ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nb);
    off+=30+nb.length+d.length;
  });
  let cdLen=0; cd.forEach(x=>cdLen+=x.length);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,files.length,true);eo.setUint16(10,files.length,true);
  eo.setUint32(12,cdLen,true);eo.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(eo.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xmlEsc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function celdaRef(c,r){let s="";c++;while(c>0){s=String.fromCharCode(64+((c-1)%26+1))+s;c=Math.floor((c-1)/26);}return s+r;}
const XLSX_STYLES=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><color rgb="FF0D47A1"/><name val="Calibri"/></font><font><i/><sz val="11"/><color rgb="FF607D8B"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1565C0"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="4"><xf/><xf fontId="1" applyFont="1"/><xf fontId="2" applyFont="1"/><xf fontId="3" fillId="2" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`;
function xlsxCrear(filas,ejecutores,colValida,nTitulo,nombreHoja){
  nombreHoja=nombreHoja||"Asignación";
  const conLista=colValida>=0;
  const enc=new TextEncoder();
  const estiloFila=ri=>!nTitulo?0:(ri===1?1:(ri<=nTitulo?2:(ri===nTitulo+2?3:0)));
  const fila=(f,ri)=>{const s=estiloFila(ri);
    return `<row r="${ri}">${f.map((v,ci)=>`<c r="${celdaRef(ci,ri)}" ${s?`s="${s}" `:""}t="inlineStr"><is><t>${xmlEsc(v)}</t></is></c>`).join("")}</row>`;};
  const colL=celdaRef(colValida,1).replace(/\d+$/,"");
  const dv=colValida<0?"":`<dataValidations count="1"><dataValidation type="list" allowBlank="1" sqref="${colL}${(nTitulo?nTitulo+3:2)}:${colL}${filas.length}"><formula1>Ejecutores!$A$1:$A$${ejecutores.length}</formula1></dataValidation></dataValidations>`;
  const ns='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
  const s1=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${ns}><sheetData>${filas.map((f,i)=>fila(f,i+1)).join("")}</sheetData>${dv||""}</worksheet>`;
  const s2=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${ns}><sheetData>${ejecutores.map((e2,i)=>fila([e2],i+1)).join("")}</sheetData></worksheet>`;
  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook ${ns} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(nombreHoja)}" sheetId="1" r:id="rId1"/>${conLista?'<sheet name="Ejecutores" sheetId="2" r:id="rId2"/>':""}</sheets></workbook>`;
  const RT="http://schemas.openxmlformats.org/officeDocument/2006/relationships/";
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${RT}worksheet" Target="worksheets/sheet1.xml"/>${conLista?`<Relationship Id="rId2" Type="${RT}worksheet" Target="worksheets/sheet2.xml"/>`:""}<Relationship Id="rId3" Type="${RT}styles" Target="styles.xml"/></Relationships>`;
  const root=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${RT}officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>${conLista?'<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>':""}</Types>`;
  return zipCrear([
    {n:"[Content_Types].xml",d:enc.encode(ct)},{n:"_rels/.rels",d:enc.encode(root)},
    {n:"xl/workbook.xml",d:enc.encode(wb)},{n:"xl/_rels/workbook.xml.rels",d:enc.encode(rels)},
    {n:"xl/styles.xml",d:enc.encode(XLSX_STYLES)},{n:"xl/worksheets/sheet1.xml",d:enc.encode(s1)},{n:"xl/worksheets/sheet2.xml",d:enc.encode(s2)}
  ]);
}

async function subirAsignaciones(inp){
  const f=inp.files[0]; if(!f) return; inp.value="";
  const aviso=t=>{const el=$("#sub-estado"); if(el)el.innerHTML=t; else alert(t.replace(/<[^>]+>/g,""));};
  try{
    const libro=await leerLibro(await f.arrayBuffer());
    const hoja=libro.hojas["Asignación"]||Object.values(libro.hojas)[0];
    const filas=await leerHoja(libro.entradas,hoja,libro.ss);
    const nums=Object.keys(filas).map(Number).sort((a,b)=>a-b);
    const hdr=filas[nums[0]]||{};
    let colId=null,colResp=null;
    Object.entries(hdr).forEach(([c,v])=>{const t=String(v).trim().toLowerCase();
      if(t==="id")colId=+c; if(t.startsWith("responsable"))colResp=+c;});
    if(colId==null||colResp==null) throw new Error('El archivo debe tener columnas "ID" y "Responsable" (usa el exportado desde aquí).');
    if(!S.asig[mesAsig])S.asig[mesAsig]={};
    let n=0;
    nums.slice(1).forEach(r=>{
      const id=parseInt((filas[r]||{})[colId],10), resp=String((filas[r]||{})[colResp]||"").trim();
      if(!isNaN(id)&&resp&&eq(id)){ S.asig[mesAsig][id]=resp; n++; }
    });
    guardar(); render();

function exportarAsigCSV(m){

function descargarCSV(filas,nombre){
  const csv="﻿"+filas.map(f=>f.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=nombre; a.click(); URL.revokeObjectURL(a.href);
}

           ${S.responsables.map(r=>`<option>${esc(r)}</option>`).join("")}</select>`

function addHito(cid){
  const c=S.correctivos.find(x=>x.id===cid);
  const tipo=$("#hito-tipo").value, fecha=$("#hito-fecha").value||hoyISO();
  const h={tipo,fecha};
  document.querySelectorAll("#hito-campos input, #hito-campos select").forEach(i=>{ if(i.value.trim()) h[i.dataset.k]=i.value.trim(); });
  c.hitos.push(h);
  ordenarHitos(c);
  const e=eq(c.eqId), def=HITOS[tipo];
  if(tipo==="envio") e.estado="En servicio técnico";
  else if(tipo==="retorno") e.estado="No operativo";
  const det=def.campos.map(([k,lbl])=>h[k]?`${lbl}: ${h[k]}`:"").filter(Boolean).join(", ");
  const stHito = tipo==="envio"?"En servicio técnico":(tipo==="retorno"?"No operativo":(tipo==="entrega"?"Operativo":""));
  agregarFicha(c.eqId,fecha,`${def.nombre}${det?" — "+det:""} (caso #${c.id})`,h.ingeniero||"",stHito);
  if(tipo==="entrega") alCerrarCaso(c);
  guardar(); pintarModalCorr();
}
function alCerrarCaso(c){
  const e=eq(c.eqId);
  c.cerrado=true;
  e.estado="Operativo";
  // MP reprogramada por C2/C3/C4 sin ejecutar: debe gestionarse al retorno
  const pendMP=e.resultado.some((r,m)=>/^C[234]$/.test(codResultado(r[1])) && !e.resultado.some((r2,m2)=>m2>m&&esEjecutada(codResultado(r2[1]))));
  const yaExiste=S.pendientes.some(p=>p.eqId===e.id && !p.done && p.titulo.startsWith("Ejecutar MP pendiente"));
  if(pendMP && !yaExiste){
    S.pendientes.push({id:S.nextPend++, titulo:`Ejecutar MP pendiente al retorno — ${nombreEq(e)} (Inv. ${e.inv})`,
      eqId:e.id, limite:hoyISO(), notas:"El equipo retornó de ST con una MP reprogramada por causal C2/C3/C4: debe ejecutarse de inmediato.",
      sub:[], updates:[], done:false, creado:hoyISO()});
    alert("Ojo: este equipo tiene una MP reprogramada por causal C2/C3/C4 sin ejecutar. Se creó un pendiente para gestionarla al retorno.");
  }
}
function addSeg(cid){
  const c=S.correctivos.find(x=>x.id===cid);
  const t=$("#seg-texto").value.trim();
  if(!t) return;
  c.seguimiento.push({f:hoyISO(),t});
  guardar(); pintarModalCorr();
}
function delHito(cid,i){
  const c=S.correctivos.find(x=>x.id===cid);
  const h=c.hitos[i];
  if(!confirm(`¿Eliminar el hito "${HITOS[h.tipo].nombre}" del ${fmtF(h.fecha)}?\n(El evento asociado en la ficha técnica no se borra; elimínalo desde la ficha del equipo si corresponde.)`)) return;
  c.hitos.splice(i,1);
  // si se eliminó la entrega, el caso vuelve a quedar abierto
  c.cerrado=c.hitos.some(x=>x.tipo==="entrega");
  guardar(); pintarModalCorr();
}
function delSeg(cid,i){
  const c=S.correctivos.find(x=>x.id===cid);
  if(!confirm("¿Eliminar esta anotación de seguimiento?")) return;
  c.seguimiento.splice(i,1);
  guardar(); pintarModalCorr();
}
function delCorr(cid){
  const c=S.correctivos.find(x=>x.id===cid);
  const e=eq(c.eqId);
  if(!confirm(`¿Eliminar el caso #${c.id} completo (${nombreEq(e)})?\nSe borran sus hitos y seguimientos. Esta acción no se puede deshacer.`)) return;
  S.correctivos=S.correctivos.filter(x=>x.id!==cid);
  guardar(); cerrarModal();
}
function cerrarCaso(cid){
  const c=S.correctivos.find(x=>x.id===cid);
  c.hitos.push({tipo:"entrega",fecha:hoyISO()});
  ordenarHitos(c);
  agregarFicha(c.eqId,hoyISO(),`Equipo entregado al servicio clínico, caso #${c.id} cerrado. Equipo operativo.`);
  alCerrarCaso(c);
  guardar(); pintarModalCorr();
}

  return !confirm(`Ya existe un pendiente abierto "${dup.titulo}"${e?` para el equipo ${e.inv||e.serie} (${e.equipo})`:""}.\n¿Crear otro de todos modos?`);

/* ====================== Lector de Excel (.xlsm/.xlsx) ====================== */
/* Lee el ZIP del archivo Office con DecompressionStream (nativo de Chrome/Edge),
   sin librerías externas, para funcionar sin internet. */
async function zipInflar(u8){
  const ds=new DecompressionStream("deflate-raw");
  const st=new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function zipEntradas(buf){
  const b=new Uint8Array(buf), dv=new DataView(buf);
  // localizar End of Central Directory
  let eocd=-1;
  for(let i=b.length-22;i>=Math.max(0,b.length-66000);i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  }
  if(eocd<0) throw new Error("El archivo no es un Excel válido (.xlsm/.xlsx).");
  const total=dv.getUint16(eocd+10,true);
  let pos=dv.getUint32(eocd+16,true);
  const td=new TextDecoder();
  const out={};
  for(let n=0;n<total;n++){
    if(dv.getUint32(pos,true)!==0x02014b50) break;
    const metodo=dv.getUint16(pos+10,true);
    const csize=dv.getUint32(pos+20,true);
    const nlen=dv.getUint16(pos+28,true), xlen=dv.getUint16(pos+30,true), clen=dv.getUint16(pos+32,true);
    const offLocal=dv.getUint32(pos+42,true);
    const nombre=td.decode(b.subarray(pos+46,pos+46+nlen));
    const lnlen=dv.getUint16(offLocal+26,true), lxlen=dv.getUint16(offLocal+28,true);
    const ini=offLocal+30+lnlen+lxlen;
    out[nombre]={datos:b.subarray(ini,ini+csize), metodo};
    pos+=46+nlen+xlen+clen;
  }
  return out;
}
async function zipLeer(entradas,nombre){
  const e=entradas[nombre];
  if(!e) return null;
  const datos = e.metodo===0 ? e.datos : await zipInflar(e.datos);
  return new TextDecoder().decode(datos);
}
function desXML(t){
  return t.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')
    .replace(/&apos;/g,"'").replace(/&#x([0-9a-fA-F]+);/g,(s,h)=>String.fromCodePoint(parseInt(h,16)))
    .replace(/&#(\d+);/g,(s,d)=>String.fromCodePoint(+d)).replace(/&amp;/g,"&");
}
function colNum(ref){ // "AB12" -> columna 28
  let c=0;
  for(const ch of ref){ if(ch>="A"&&ch<="Z") c=c*26+(ch.charCodeAt(0)-64); else break; }
  return c;
}
async function leerHoja(entradas,rutaHoja,ss){
  const xml=await zipLeer(entradas,rutaHoja);
  if(xml==null) throw new Error("No se encontró la hoja en el archivo.");
  const filas={};
  for(const m of xml.matchAll(/<c\s+([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
    const attrs=m[1], cuerpo=m[2]||"";
    const ref=(attrs.match(/r="([^"]+)"/)||[])[1];
    if(!ref) continue;
    const tipo=(attrs.match(/t="([^"]+)"/)||[])[1]||"";
    let val="";
    if(tipo==="inlineStr"){
      val=[...cuerpo.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>desXML(x[1])).join("");
    }else{
      const v=(cuerpo.match(/<v[^>]*>([\s\S]*?)<\/v>/)||[])[1];
      if(v==null) continue;
      val = tipo==="s" ? (ss[+v]??"") : desXML(v);
    }
    const fila=+ref.replace(/^[A-Z]+/,""), col=colNum(ref);
    if(!filas[fila]) filas[fila]={};
    filas[fila][col]=String(val).trim();
  }
  return filas;
}
async function leerLibro(buf){
  const entradas=await zipEntradas(buf);
  const ssXml=await zipLeer(entradas,"xl/sharedStrings.xml");
  const ss=ssXml?[...ssXml.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>
    [...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(t=>desXML(t[1])).join("")):[];
  const wb=await zipLeer(entradas,"xl/workbook.xml");
  const rels=await zipLeer(entradas,"xl/_rels/workbook.xml.rels");
  const mapaRel={};
  for(const m of rels.matchAll(/<Relationship\b[^>]*>/g)){
    const id=(m[0].match(/Id="([^"]+)"/)||[])[1];
    const tgt=(m[0].match(/Target="([^"]+)"/)||[])[1];
    if(id&&tgt) mapaRel[id]=tgt;
  }
  const hojas={};
  for(const m of wb.matchAll(/<sheet\b[^>]*>/g)){
    const nombre=(m[0].match(/name="([^"]+)"/)||[])[1];
    const rid=(m[0].match(/r:id="([^"]+)"/)||[])[1];
    if(nombre&&rid&&mapaRel[rid])
      hojas[desXML(nombre)]="xl/"+mapaRel[rid].replace(/^\/?(xl\/)?/,"");
  }
  return {entradas,ss,hojas};
}

/* ====================== Importar maestro PMP ====================== */
const VALORES_PLAN=["X","R","RA","PM"];
function valLimpio(v){ v=(v==null?"":String(v)).trim(); return v==="0"||v==="N/A"||v==="n/a"?"":v; }
function filaEncabezado(filas){
  for(let f=1;f<=15;f++) if(filas[f] && String(filas[f][2]||"").trim()==="ID") return f;
  throw new Error('No se encontró la fila de encabezado (columna B = "ID").');
}
async function importarMaestro(buf){
  const libro=await leerLibro(buf);
  if(!libro.hojas["PMP_2026"]) throw new Error('El archivo no contiene la hoja "PMP_2026".');
  const pmp=await leerHoja(libro.entradas,libro.hojas["PMP_2026"],libro.ss);
  const hReg=libro.hojas["Registro_MP-2026"];
  const reg=hReg?await leerHoja(libro.entradas,hReg,libro.ss):null;

  // ---- PMP_2026: columnas B..AE, excluyendo Q (observación) y S (responsable MP)
  const hdr=filaEncabezado(pmp);
  const nuevos={};   // id -> datos del archivo
  let famAnterior="";
  const filasOrden=Object.keys(pmp).map(Number).filter(f=>f>hdr).sort((a,b)=>a-b);
  for(const f of filasOrden){
    const fila=pmp[f];
    const id=parseInt(fila[2],10);
    if(isNaN(id)) continue;
    let fam=valLimpio(fila[1]);
    if(fam) famAnterior=fam; else fam=famAnterior;
    const plan=[];
    for(let i=0;i<12;i++){
      const v=valLimpio(fila[20+i]).toUpperCase();
      plan.push(VALORES_PLAN.includes(v)?v:"");
    }
    nuevos[id]={
      fam, carpeta:valLimpio(fila[3]), inv:valLimpio(fila[4]), equipo:valLimpio(fila[5]),
      servicio:valLimpio(fila[6]), unidad:valLimpio(fila[7]), ubicacion:valLimpio(fila[8]),
      proc:valLimpio(fila[9]), marca:valLimpio(fila[10]), modelo:valLimpio(fila[11]),
      serie:(fila[12]==null?"":String(fila[12])).trim(), anio:valLimpio(fila[13]),
      clasif:valLimpio(fila[15]), frec:valLimpio(fila[18]), plan,
      resultado:null, obsReg:""
    };
  }
  if(!Object.keys(nuevos).length) throw new Error("No se encontraron equipos en la hoja PMP_2026.");

  // ---- Registro_MP-2026: pares P/R por mes (columnas T..AQ), excluyendo Q y S
  if(reg){
    const hdr2=filaEncabezado(reg);
    for(const f of Object.keys(reg).map(Number).filter(x=>x>hdr2).sort((a,b)=>a-b)){
      const fila=reg[f];
      const id=parseInt(fila[2],10);
      if(isNaN(id)||!nuevos[id]) continue;
      const res=[];
      for(let i=0;i<12;i++){
        const p=valLimpio(fila[20+2*i]).toUpperCase();
        res.push([VALORES_PLAN.includes(p)?p:"", valLimpio(fila[21+2*i])]);
      }
      nuevos[id].resultado=res;
      nuevos[id].obsReg=valLimpio(fila[44]);
    }
  }

  // ---- Fusión: el archivo manda en datos de equipo, plan y resultados;
  //      la app conserva fichas/correctivos/pendientes, estado, baja,
  //      observación (col. Q) y responsable MP (col. S)
  const CAMPOS=["fam","carpeta","inv","equipo","servicio","unidad","ubicacion","proc","marca","modelo","serie","anio","clasif","frec"];
  let actualizados=0, agregados=0, sinArchivo=0;
  const soloApp=[], conflictos=[];   // diferencias entre la app y el Excel oficial
  const vistos=new Set();
  S.equipos.forEach(e=>{
    const n=nuevos[e.id];
    if(!n){ sinArchivo++; return; }
    vistos.add(e.id);
    CAMPOS.forEach(k=>{ if(n[k]!=="") e[k]=n[k]; });
    for(let i=0;i<12;i++){
      if(n.plan[i]) e.plan[i]=n.plan[i];
      if(n.resultado){
        if(n.resultado[i][0]) e.resultado[i][0]=n.resultado[i][0];
        const vArch=n.resultado[i][1], vApp=e.resultado[i][1];
        if(vArch){
          if(vApp && codResultado(vApp)!==codResultado(vArch))
            conflictos.push({id:e.id, m:i, app:vApp, arch:vArch});
          e.resultado[i][1]=vArch;
        }else if(vApp){
          soloApp.push({id:e.id, m:i, res:vApp});
        }
      }
    }
    if(n.obsReg) e.obsReg=n.obsReg;
    actualizados++;
  });
  Object.entries(nuevos).forEach(([id,n])=>{
    id=+id;
    if(vistos.has(id)) return;
    S.equipos.push({
      id, ...Object.fromEntries(CAMPOS.map(k=>[k,n[k]])),
      obs:"", respMP:"", plan:n.plan,
      resultado:n.resultado||Array.from({length:12},()=>["",""]),
      obsReg:n.obsReg, estado:"Operativo", baja:false
    });
    agregados++;
  });
  S.equipos.sort((a,b)=>a.id-b.id);
  S.ultimaImport=hoyISO();
  guardar();
  return {actualizados, agregados, sinArchivo, soloApp, conflictos, total:Object.keys(nuevos).length};
}
async function importarMaestroUI(inp){
  const f=inp.files[0];
  if(!f) return;
  inp.value="";
  if(typeof DecompressionStream==="undefined")
    return alert("Este navegador no soporta la lectura de Excel. Usa Chrome o Edge actualizados.");
  const aviso=$("#imp-estado");
  if(aviso) aviso.textContent="Leyendo "+f.name+"…";
  try{
    const buf=await f.arrayBuffer();
    const r=await importarMaestro(buf);
    render();
    const msg=`✔ Importación completada: ${r.actualizados} equipos actualizados, `+
      `${r.agregados} nuevos agregados`+
      (r.sinArchivo?`, ${r.sinArchivo} equipos de la app no venían en el archivo (se conservan tal cual)`:"")+
      `. Lo registrado en la aplicación se mantuvo intacto.`;
    const el=$("#imp-estado");
    if(el) el.innerHTML=msg; else alert(msg);
    if(r.soloApp.length||r.conflictos.length) mostrarReporteImport(r);
  }catch(e){
    console.error(e);
    const msg="✘ Error al importar: "+e.message;
    const el=$("#imp-estado");
    if(el) el.innerHTML=`<span style="color:var(--rojo)">${esc(msg)}</span>`; else alert(msg);
  }
}

/* ====================== Reporte de diferencias con el Excel oficial ====================== */
let _repImp=null;
function mostrarReporteImport(r){
  _repImp=r;
  const filaSolo=x=>{const e=eq(x.id); const d=S.mpEjec[x.id+"-"+x.m]||{};
    return `<tr><td>${esc(e.inv)||esc(e.serie)}</td><td>${esc(e.equipo)} ${esc(e.marca)}</td>
    <td>${esc(e.servicio)}</td><td>${MESES[x.m]}</td><td>${tagRes(x.res)}</td>
    <td class="nota">${d.f?fmtF(d.f):""} ${esc(d.e||"")} ${esc(d.st||"")}</td></tr>`;};
  const filaConf=x=>{const e=eq(x.id);
    return `<tr><td>${esc(e.inv)||esc(e.serie)}</td><td>${esc(e.equipo)} ${esc(e.marca)}</td>
    <td>${esc(e.servicio)}</td><td>${MESES[x.m]}</td><td>${tagRes(x.app)} → ${tagRes(x.arch)}</td></tr>`;};
  $("#modal").innerHTML=`
  <button class="cerrar" onclick="cerrarModal()">×</button>
  <h2>Diferencias con el Excel oficial</h2>
  ${r.soloApp.length?`
  <h3>⚠️ Registrado en la app pero FALTA en el Excel oficial (${r.soloApp.length})</h3>
  <p class="nota">Estos resultados debes traspasarlos a la planilla oficial. Exporta la lista para tenerla a mano;
  al reimportar el Excel ya corregido, desaparecerán de este listado.</p>
  <div class="flex no-print" style="margin-bottom:8px">
    <button class="btn mini" onclick="exportarTraspaso()">⬇ Exportar lista de traspaso (CSV)</button>
    <button class="btn mini sec" onclick="window.print()">🖨 Imprimir</button>
  </div>
  <div class="tablewrap" style="max-height:35vh"><table>
    <tr><th>Inventario</th><th>Equipo</th><th>Servicio</th><th>Mes</th><th>Resultado en la app</th><th>Ejecución</th></tr>
    ${r.soloApp.map(filaSolo).join("")}
  </table></div>`:""}
  ${r.conflictos.length?`
  <h3>El Excel traía un valor distinto y reemplazó al de la app (${r.conflictos.length})</h3>
  <p class="nota">El Excel es el documento oficial, por eso su valor manda. Revisa que el cambio sea correcto.</p>
  <div class="tablewrap" style="max-height:30vh"><table>
    <tr><th>Inventario</th><th>Equipo</th><th>Servicio</th><th>Mes</th><th>App → Excel</th></tr>
    ${r.conflictos.map(filaConf).join("")}
  </table></div>`:""}`;
  $("#modal-fondo").classList.add("abierto");
}
function exportarTraspaso(){
  if(!_repImp) return;
  const filas=[["ID","N° Inventario","Equipo","Servicio","Mes","Resultado (app)","Fecha ejecución","Ejecutor","Estado del equipo","Observaciones"]];
  _repImp.soloApp.forEach(x=>{
    const e=eq(x.id), d=S.mpEjec[x.id+"-"+x.m]||{};
    filas.push([e.id,e.inv,e.equipo,e.servicio,MESES_L[x.m],x.res,d.f||"",d.e||"",d.st||"",d.o||""]);
  });
  descargarCSV(filas,`Traspaso_a_Excel_${hoyISO()}.csv`);
}

/* ====================== Informe mensual por servicio ====================== */
let mesInf = new Date().getFullYear()===ANIO ? new Date().getMonth() : 0;
let servInf = "";
function vInformes(){
  const m=mesInf;
  const conMP=S.equipos.filter(e=>!e.baja && ["X","R","RA","PM"].includes(e.plan[m]));
  const servicios=[...new Set(conMP.map(e=>e.servicio).filter(Boolean))].sort();
  const lista=conMP.filter(e=>!servInf||e.servicio===servInf);
  const grupos={};
  lista.forEach(e=>{ const s=e.servicio||"(sin servicio)"; (grupos[s]=grupos[s]||[]).push(e); });
  const bloque=(srv,eqs)=>`
    <h3 style="page-break-before:auto">${esc(srv)} — ${MESES_L[m]} ${ANIO}</h3>
    <table style="margin-bottom:14px">
      <tr><th>Inventario</th><th>Equipo</th><th>Ubicación</th><th>Prog.</th><th>Resultado</th>
      <th>Fecha ejec.</th><th>Ejecutor</th><th>Estado del equipo</th><th>Observaciones</th></tr>
      ${eqs.map(e=>{
        const r=codResultado(e.resultado[m][1]);
        const d=S.mpEjec[e.id+"-"+m]||{};
        const est=d.st || e.estado || "";
        const clsEst=est==="Operativo"?"op":(est==="En servicio técnico"?"st":"nop");
        return `<tr class="clic" onclick="clickFila(event,()=>abrirEquipo(${e.id}))"><td>${esc(e.inv)||esc(e.serie)}</td>
        <td>${esc(e.equipo)} ${esc(e.marca)} ${esc(e.modelo)}</td>
        <td>${esc(e.unidad)} ${esc(e.ubicacion)}</td>
        <td>${tagPlan(e.plan[m])}</td>
        <td>${tagRes(r)||'<span class="nota">pendiente</span>'}</td>
        <td>${d.f?fmtF(d.f):"—"}</td><td>${esc(d.e||"")}</td>
        <td>${est?`<span class="tag ${clsEst}">${esc(est)}</span>`:""}</td>
        <td class="nota">${esc(d.o||"")}${/^C/.test(r)?` ${esc(CAUSALES[r]||"")}`:""}</td></tr>`;
      }).join("")}
    </table>`;
  return `
  <h2>Informe mensual de mantenciones por servicio clínico</h2>
  <div class="fila-filtros no-print">
    <select onchange="mesInf=+this.value;render()">${MESES_L.map((n,i)=>`<option value="${i}" ${i===m?"selected":""}>${n} ${ANIO}</option>`).join("")}</select>
    <select onchange="servInf=this.value;render()">
      <option value="">— Todos los servicios —</option>
      ${servicios.map(s=>`<option ${servInf===s?"selected":""}>${esc(s)}</option>`).join("")}
    </select>
    <button class="btn" onclick="exportarInformeCSV()">⬇ Exportar Excel (CSV)</button>
    <button class="btn sec" onclick="window.print()">🖨 Imprimir informe</button>
    <span class="derecha nota">${lista.length} equipos con MP en ${MESES_L[m]}</span>
  </div>
  <p class="solo-print"><b>Hospital Regional de Temuco — Equipamiento clínico crítico</b><br>
  Informe de mantenciones preventivas y estado de equipos · ${MESES_L[m]} ${ANIO}</p>
  ${Object.entries(grupos).sort((a,b)=>a[0]<b[0]?-1:1).map(([s,eqs])=>bloque(s,eqs)).join("")
    ||'<p class="nota">Sin mantenciones programadas para este filtro.</p>'}`;
}
function exportarInformeCSV(){
  const m=mesInf;
  const filas=[["Servicio","N° Inventario","Equipo","Marca","Modelo","Unidad","Ubicación","Programado","Resultado","Fecha ejecución","Ejecutor","Estado del equipo","Observaciones"]];
  S.equipos.forEach(e=>{
    if(e.baja||!["X","R","RA","PM"].includes(e.plan[m])) return;
    if(servInf&&e.servicio!==servInf) return;
    const r=codResultado(e.resultado[m][1]);
    const d=S.mpEjec[e.id+"-"+m]||{};
    filas.push([e.servicio,e.inv,e.equipo,e.marca,e.modelo,e.unidad,e.ubicacion,e.plan[m],
      r||"Pendiente",d.f||"",d.e||"",d.st||e.estado||"",(d.o||"")+(/^C/.test(r)?" "+(CAUSALES[r]||""):"")]);
  });
  descargarCSV(filas,`Informe_servicios_${MESES_L[m]}_${ANIO}.csv`);
}

/* ====================== Inicio ====================== */
document.getElementById("nav").addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  tabActual=b.dataset.t; render();
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") cerrarModal(); });
cargar();
normalizar();
$("#hoy-txt").textContent=new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
render();
</script>
